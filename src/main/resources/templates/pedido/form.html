<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Novo Pedido de Compra</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/pedidos}">Pedidos de Compra</a></li>
      <li class="breadcrumb-item active">Novo Pedido</li>
    </ol>
  </nav>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">Novo Pedido de Compra</h5>
    </div>
    <div class="card-body">
      <form th:action="@{/web/pedidos}"
            th:object="${pedidoForm}"
            method="post"
            novalidate>

        <h6 class="text-muted mb-3">Cabeçalho do Pedido</h6>

        <div class="mb-3">
          <label for="fornecedorId" class="form-label">Fornecedor <span class="text-danger">*</span></label>
          <select id="fornecedorId" name="fornecedorId" class="form-select"
                  th:classappend="${#fields.hasErrors('fornecedorId')} ? 'is-invalid'"
                  required>
            <option value="">Selecione o fornecedor...</option>
            <option th:each="f : ${fornecedores}"
                    th:value="${f.id}"
                    th:text="${f.razaoSocial + ' — ' + f.cnpj}"
                    th:selected="${pedidoForm.fornecedorId != null and pedidoForm.fornecedorId == f.id}">
            </option>
          </select>
          <div class="invalid-feedback" th:errors="*{fornecedorId}"></div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="dataEmissao" class="form-label">Data de Emissão <span class="text-danger">*</span></label>
            <input type="date" id="dataEmissao" name="dataEmissao" class="form-control"
                   th:field="*{dataEmissao}"
                   th:classappend="${#fields.hasErrors('dataEmissao')} ? 'is-invalid'"
                   required />
            <div class="invalid-feedback" th:errors="*{dataEmissao}"></div>
          </div>
          <div class="col-md-6 mb-3">
            <label for="dataPrevisaoEntrega" class="form-label">Previsão de Entrega</label>
            <input type="date" id="dataPrevisaoEntrega" name="dataPrevisaoEntrega" class="form-control"
                   th:field="*{dataPrevisaoEntrega}" />
          </div>
        </div>

        <div class="mb-3">
          <label for="observacao" class="form-label">Observação</label>
          <textarea id="observacao" name="observacao" class="form-control"
                    th:field="*{observacao}"
                    rows="2" maxlength="500"></textarea>
        </div>

        <hr />
        <h6 class="text-muted mb-3">Primeiro Item <span class="text-danger">*</span> (obrigatório)</h6>

        <div class="mb-3">
          <label for="itemProdutoId" class="form-label">Produto <span class="text-danger">*</span></label>
          <select id="itemProdutoId" name="itemProdutoId" class="form-select"
                  th:classappend="${#fields.hasErrors('itemProdutoId')} ? 'is-invalid'"
                  required>
            <option value="">Selecione o produto...</option>
            <option th:each="p : ${produtos}"
                    th:value="${p.id}"
                    th:text="${p.sku + ' — ' + p.nome}"
                    th:selected="${pedidoForm.itemProdutoId != null and pedidoForm.itemProdutoId == p.id}">
            </option>
          </select>
          <div class="invalid-feedback" th:errors="*{itemProdutoId}"></div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="itemQuantidade" class="form-label">Quantidade <span class="text-danger">*</span></label>
            <input type="number" id="itemQuantidade" name="itemQuantidade" class="form-control"
                   th:field="*{itemQuantidade}"
                   th:classappend="${#fields.hasErrors('itemQuantidade')} ? 'is-invalid'"
                   min="1" required />
            <div class="invalid-feedback" th:errors="*{itemQuantidade}"></div>
          </div>
          <div class="col-md-4 mb-3">
            <label for="itemPrecoUnitario" class="form-label">Preço Unitário <span class="text-danger">*</span></label>
            <input type="number" id="itemPrecoUnitario" name="itemPrecoUnitario" class="form-control"
                   th:field="*{itemPrecoUnitario}"
                   th:classappend="${#fields.hasErrors('itemPrecoUnitario')} ? 'is-invalid'"
                   min="0.01" step="0.01" required />
            <div class="invalid-feedback" th:errors="*{itemPrecoUnitario}"></div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary">Criar Pedido</button>
          <a th:href="@{/web/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
