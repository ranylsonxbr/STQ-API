<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Novo Pedido de Compra</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('pedidos')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/pedidos}">Pedidos</a>
      <span class="sep">/</span>
      <span class="cur">Novo Pedido</span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-card" style="max-width: 680px;">
      <div class="stq-card-header">Novo Pedido de Compra</div>
      <div class="stq-card-body">
        <form th:action="@{/web/pedidos}" th:object="${pedidoForm}" method="post" novalidate>

          <p style="font-size: 12px; font-weight: 600; color: var(--stq-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;">Cabeçalho</p>

          <div class="stq-form-group">
            <label for="fornecedorId" class="stq-label">Fornecedor <span class="stq-req">*</span></label>
            <select id="fornecedorId" name="fornecedorId" class="stq-select"
                    th:classappend="${#fields.hasErrors('fornecedorId')} ? ' is-invalid'" required>
              <option value="">Selecione o fornecedor...</option>
              <option th:each="f : ${fornecedores}" th:value="${f.id}"
                      th:text="${f.razaoSocial + ' — ' + f.cnpj}"
                      th:selected="${pedidoForm.fornecedorId != null and pedidoForm.fornecedorId == f.id}"></option>
            </select>
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('fornecedorId')}" th:errors="*{fornecedorId}"></div>
          </div>

          <div class="stq-form-grid">
            <div class="stq-form-group">
              <label for="dataEmissao" class="stq-label">Data de Emissão <span class="stq-req">*</span></label>
              <input type="date" id="dataEmissao" name="dataEmissao" class="stq-input"
                     th:field="*{dataEmissao}" th:classappend="${#fields.hasErrors('dataEmissao')} ? ' is-invalid'"
                     required />
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('dataEmissao')}" th:errors="*{dataEmissao}"></div>
            </div>
            <div class="stq-form-group">
              <label for="dataPrevisaoEntrega" class="stq-label">Previsão de Entrega</label>
              <input type="date" id="dataPrevisaoEntrega" name="dataPrevisaoEntrega" class="stq-input"
                     th:field="*{dataPrevisaoEntrega}" />
            </div>
            <div class="stq-form-group stq-form-full">
              <label for="observacao" class="stq-label">Observação</label>
              <textarea id="observacao" name="observacao" class="stq-textarea"
                        th:field="*{observacao}" rows="2" maxlength="500"></textarea>
            </div>
          </div>

          <hr style="border-color: var(--stq-border); margin: 16px 0;" />
          <p style="font-size: 12px; font-weight: 600; color: var(--stq-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px;">Primeiro Item <span class="stq-req">*</span></p>

          <div class="stq-form-group">
            <label for="itemProdutoId" class="stq-label">Produto <span class="stq-req">*</span></label>
            <select id="itemProdutoId" name="itemProdutoId" class="stq-select"
                    th:classappend="${#fields.hasErrors('itemProdutoId')} ? ' is-invalid'" required>
              <option value="">Selecione o produto...</option>
              <option th:each="p : ${produtos}" th:value="${p.id}"
                      th:text="${p.sku + ' — ' + p.nome}"
                      th:selected="${pedidoForm.itemProdutoId != null and pedidoForm.itemProdutoId == p.id}"></option>
            </select>
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('itemProdutoId')}" th:errors="*{itemProdutoId}"></div>
          </div>

          <div class="stq-form-grid">
            <div class="stq-form-group">
              <label for="itemQuantidade" class="stq-label">Quantidade <span class="stq-req">*</span></label>
              <input type="number" id="itemQuantidade" name="itemQuantidade" class="stq-input"
                     th:field="*{itemQuantidade}" th:classappend="${#fields.hasErrors('itemQuantidade')} ? ' is-invalid'"
                     min="1" required />
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('itemQuantidade')}" th:errors="*{itemQuantidade}"></div>
            </div>
            <div class="stq-form-group">
              <label for="itemPrecoUnitario" class="stq-label">Preço Unitário <span class="stq-req">*</span></label>
              <input type="number" id="itemPrecoUnitario" name="itemPrecoUnitario" class="stq-input"
                     th:field="*{itemPrecoUnitario}" th:classappend="${#fields.hasErrors('itemPrecoUnitario')} ? ' is-invalid'"
                     min="0.01" step="0.01" required />
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('itemPrecoUnitario')}" th:errors="*{itemPrecoUnitario}"></div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center" style="margin-top: 8px;">
            <a th:href="@{/web/pedidos}" class="stq-btn-link">Cancelar</a>
            <button type="submit" class="stq-btn stq-btn-primary">
              <i data-lucide="save" class="stq-icon"></i> Criar Pedido
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
