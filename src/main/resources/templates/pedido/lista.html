<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Pedidos de Compra</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Pedidos de Compra</h2>
    <a th:href="@{/web/pedidos/novo}" class="btn btn-primary btn-sm"
       sec:authorize="hasAnyRole('ADMIN','OPERADOR')">+ Novo Pedido</a>
  </div>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <!-- Filtro por status -->
  <form th:action="@{/web/pedidos}" method="get" class="row g-2 mb-4">
    <div class="col-md-3">
      <select name="status" class="form-select">
        <option value="">Todos os Status</option>
        <option th:each="s : ${statusPedido}"
                th:value="${s.name()}"
                th:text="${s.name()}"
                th:selected="${filtroStatus != null and filtroStatus.name() == s.name()}"></option>
      </select>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-outline-primary w-100">Filtrar</button>
    </div>
    <div class="col-md-1">
      <a th:href="@{/web/pedidos}" class="btn btn-outline-secondary w-100">Limpar</a>
    </div>
  </form>

  <div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>Fornecedor</th>
          <th>Status</th>
          <th>Data Emissão</th>
          <th>Previsão Entrega</th>
          <th>Total</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${pedidos.content}">
          <td th:text="${p.fornecedorNome}"></td>
          <td>
            <span class="badge"
                  th:classappend="${p.status.name() == 'RASCUNHO'} ? 'bg-secondary' :
                                  (${p.status.name() == 'PENDENTE'} ? 'bg-warning text-dark' :
                                  (${p.status.name() == 'APROVADO'} ? 'bg-primary' :
                                  (${p.status.name() == 'RECEBIDO'} ? 'bg-success' : 'bg-danger')))"
                  th:text="${p.status}"></span>
          </td>
          <td th:text="${p.dataEmissao}"></td>
          <td th:text="${p.dataPrevisaoEntrega} ?: '—'"></td>
          <td th:text="${#numbers.formatDecimal(p.totalPedido, 1, 2)}"></td>
          <td>
            <a th:href="@{/web/pedidos/{id}(id=${p.id})}" class="btn btn-outline-primary btn-sm">
              Detalhes
            </a>
          </td>
        </tr>
        <tr th:if="${pedidos.content.empty}">
          <td colspan="6" class="text-center text-muted">Nenhum pedido encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${pedidos.totalPages > 1}">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${pedidos.first} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/pedidos(page=${pedidos.number - 1}, size=${pedidos.size}, status=${filtroStatus})}">
          Anterior
        </a>
      </li>
      <li class="page-item disabled">
        <span class="page-link"
              th:text="${'Página ' + (pedidos.number + 1) + ' de ' + pedidos.totalPages}"></span>
      </li>
      <li class="page-item" th:classappend="${pedidos.last} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/pedidos(page=${pedidos.number + 1}, size=${pedidos.size}, status=${filtroStatus})}">
          Próxima
        </a>
      </li>
    </ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
