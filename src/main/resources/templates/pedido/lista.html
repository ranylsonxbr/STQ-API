<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Pedidos de Compra</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('pedidos')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <span class="stq-topbar-title">Pedidos de Compra</span>
    <a th:href="@{/web/pedidos/novo}" class="stq-btn stq-btn-primary stq-btn-sm"
       sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
      <i data-lucide="plus" class="stq-icon"></i> Novo Pedido
    </a>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <form th:action="@{/web/pedidos}" method="get" class="stq-filter-bar">
      <select name="status" class="stq-select" style="width:180px;">
        <option value="">Todos os Status</option>
        <option th:each="s : ${statusPedido}" th:value="${s.name()}" th:text="${s.name()}"
                th:selected="${filtroStatus != null and filtroStatus.name() == s.name()}"></option>
      </select>
      <button type="submit" class="stq-btn stq-btn-outline">Filtrar</button>
      <a th:href="@{/web/pedidos}" class="stq-btn stq-btn-ghost">Limpar</a>
    </form>

    <div class="stq-table-wrap">
      <table class="stq-table">
        <thead>
          <tr><th>Fornecedor</th><th>Status</th><th>Data Emissão</th><th>Previsão Entrega</th><th>Total</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="p : ${pedidos.content}">
            <td th:text="${p.fornecedorNome}"></td>
            <td>
              <span class="stq-badge"
                    th:classappend="${p.status.name() == 'RASCUNHO'} ? 'stq-badge-default' :
                                    (${p.status.name() == 'PENDENTE'} ? 'stq-badge-warning' :
                                    (${p.status.name() == 'APROVADO'} ? 'stq-badge-primary' :
                                    (${p.status.name() == 'RECEBIDO'} ? 'stq-badge-success' : 'stq-badge-danger')))">
                <span class="stq-badge-dot"></span>
                <span th:text="${p.status}"></span>
              </span>
            </td>
            <td th:text="${p.dataEmissao}"></td>
            <td th:text="${p.dataPrevisaoEntrega} ?: '—'"></td>
            <td>R$ <span th:text="${#numbers.formatDecimal(p.totalPedido, 1, 2)}"></span></td>
            <td>
              <div class="stq-row-actions">
                <a th:href="@{/web/pedidos/{id}(id=${p.id})}" class="stq-btn stq-btn-ghost stq-btn-sm">
                  <i data-lucide="eye" class="stq-icon"></i>
                </a>
              </div>
            </td>
          </tr>
          <tr th:if="${pedidos.content.empty}">
            <td colspan="6">
              <div class="stq-empty">
                <i data-lucide="clipboard-list" class="stq-icon"></i>
                <p class="stq-empty-title">Nenhum pedido encontrado</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="stq-pagination" th:if="${pedidos.totalPages > 1}">
        <a class="stq-page-btn" th:classappend="${pedidos.first} ? 'disabled'"
           th:href="@{/web/pedidos(page=${pedidos.number - 1},size=${pedidos.size},status=${filtroStatus})}">
          <i data-lucide="chevron-left" class="stq-icon"></i> Anterior
        </a>
        <span class="stq-page-info" th:text="${'Pág. ' + (pedidos.number + 1) + ' de ' + pedidos.totalPages}"></span>
        <a class="stq-page-btn" th:classappend="${pedidos.last} ? 'disabled'"
           th:href="@{/web/pedidos(page=${pedidos.number + 1},size=${pedidos.size},status=${filtroStatus})}">
          Próxima <i data-lucide="chevron-right" class="stq-icon"></i>
        </a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
