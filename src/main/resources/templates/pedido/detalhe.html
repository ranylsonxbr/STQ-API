<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Detalhe do Pedido</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/pedidos}">Pedidos de Compra</a></li>
      <li class="breadcrumb-item active">Detalhe</li>
    </ol>
  </nav>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <!-- Cabeçalho do pedido -->
  <div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Pedido de Compra</h5>
      <span class="badge fs-6"
            th:classappend="${pedido.status.name() == 'RASCUNHO'} ? 'bg-secondary' :
                            (${pedido.status.name() == 'PENDENTE'} ? 'bg-warning text-dark' :
                            (${pedido.status.name() == 'APROVADO'} ? 'bg-primary' :
                            (${pedido.status.name() == 'RECEBIDO'} ? 'bg-success' : 'bg-danger')))"
            th:text="${pedido.status}"></span>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <dl class="row">
            <dt class="col-sm-5">Fornecedor</dt>
            <dd class="col-sm-7" th:text="${pedido.fornecedorNome}"></dd>

            <dt class="col-sm-5">Data de Emissão</dt>
            <dd class="col-sm-7" th:text="${pedido.dataEmissao}"></dd>

            <dt class="col-sm-5">Previsão de Entrega</dt>
            <dd class="col-sm-7" th:text="${pedido.dataPrevisaoEntrega} ?: '—'"></dd>
          </dl>
        </div>
        <div class="col-md-6">
          <dl class="row">
            <dt class="col-sm-5">Total do Pedido</dt>
            <dd class="col-sm-7">
              R$ <span th:text="${#numbers.formatDecimal(pedido.totalPedido, 1, 2)}"></span>
            </dd>

            <dt class="col-sm-5">Criado Em</dt>
            <dd class="col-sm-7"
                th:text="${#temporals.format(pedido.criadoEm, 'dd/MM/yyyy HH:mm')}"></dd>

            <dt class="col-sm-5">Observação</dt>
            <dd class="col-sm-7" th:text="${pedido.observacao} ?: '—'"></dd>
          </dl>
        </div>
      </div>
    </div>
  </div>

  <!-- Ações por status (ADMIN/OPERADOR) -->
  <div class="d-flex flex-wrap gap-2 mb-4" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">

    <!-- RASCUNHO: enviar e cancelar -->
    <th:block th:if="${pedido.status.name() == 'RASCUNHO'}">
      <form th:action="@{/web/pedidos/{id}/enviar(id=${pedido.id})}" method="post" class="d-inline">
        <button type="submit" class="btn btn-warning"
                onclick="return confirm('Enviar pedido para aprovação?')">Enviar para Aprovação</button>
      </form>
      <form th:action="@{/web/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-danger"
                onclick="return confirm('Cancelar este pedido?')">Cancelar Pedido</button>
      </form>
    </th:block>

    <!-- PENDENTE: aprovar (ADMIN), cancelar -->
    <th:block th:if="${pedido.status.name() == 'PENDENTE'}">
      <form th:action="@{/web/pedidos/{id}/aprovar(id=${pedido.id})}" method="post" class="d-inline"
            sec:authorize="hasRole('ADMIN')">
        <button type="submit" class="btn btn-primary"
                onclick="return confirm('Aprovar este pedido?')">Aprovar</button>
      </form>
      <form th:action="@{/web/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-danger"
                onclick="return confirm('Cancelar este pedido?')">Cancelar Pedido</button>
      </form>
    </th:block>

    <!-- APROVADO: receber -->
    <th:block th:if="${pedido.status.name() == 'APROVADO'}">
      <form th:action="@{/web/pedidos/{id}/receber(id=${pedido.id})}" method="post" class="d-inline">
        <button type="submit" class="btn btn-success"
                onclick="return confirm('Confirmar recebimento e registrar entradas no estoque?')">
          Confirmar Recebimento
        </button>
      </form>
    </th:block>

  </div>

  <!-- Itens do pedido -->
  <div class="card mb-4">
    <div class="card-header">
      <h6 class="mb-0">Itens do Pedido</h6>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-bordered align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>SKU</th>
              <th>Quantidade</th>
              <th>Preço Unitário</th>
              <th>Subtotal</th>
              <th th:if="${pedido.status.name() == 'RASCUNHO'}"
                  sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${pedido.itens}">
              <td th:text="${item.produtoSku}"></td>
              <td th:text="${item.quantidade}"></td>
              <td>R$ <span th:text="${#numbers.formatDecimal(item.precoUnitario, 1, 2)}"></span></td>
              <td>R$ <span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span></td>
              <td th:if="${pedido.status.name() == 'RASCUNHO'}"
                  sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
                <form th:action="@{/web/pedidos/{id}/itens/{itemId}/remover(id=${pedido.id},itemId=${item.id})}"
                      method="post"
                      onsubmit="return confirm('Remover este item?')">
                  <button type="submit" class="btn btn-outline-danger btn-sm">Remover</button>
                </form>
              </td>
            </tr>
            <tr th:if="${pedido.itens.empty}">
              <td colspan="5" class="text-center text-muted">Nenhum item adicionado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Adicionar item (somente RASCUNHO) -->
  <div class="card" th:if="${pedido.status.name() == 'RASCUNHO'}"
       sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
    <div class="card-header">
      <h6 class="mb-0">Adicionar Item</h6>
    </div>
    <div class="card-body">
      <form th:action="@{/web/pedidos/{id}/itens(id=${pedido.id})}"
            th:object="${itemPedidoForm}"
            method="post"
            novalidate>

        <div class="row g-3">
          <div class="col-md-4">
            <label for="itemProdutoId" class="form-label">Produto <span class="text-danger">*</span></label>
            <select id="itemProdutoId" name="produtoId" class="form-select"
                    th:classappend="${#fields.hasErrors('produtoId')} ? 'is-invalid'"
                    required>
              <option value="">Selecione...</option>
              <option th:each="p : ${produtos}"
                      th:value="${p.id}"
                      th:text="${p.sku + ' — ' + p.nome}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{produtoId}"></div>
          </div>
          <div class="col-md-2">
            <label for="itemQuantidade" class="form-label">Quantidade <span class="text-danger">*</span></label>
            <input type="number" id="itemQuantidade" name="quantidade" class="form-control"
                   th:field="*{quantidade}"
                   th:classappend="${#fields.hasErrors('quantidade')} ? 'is-invalid'"
                   min="1" required />
            <div class="invalid-feedback" th:errors="*{quantidade}"></div>
          </div>
          <div class="col-md-3">
            <label for="itemPrecoUnitario" class="form-label">Preço Unitário <span class="text-danger">*</span></label>
            <input type="number" id="itemPrecoUnitario" name="precoUnitario" class="form-control"
                   th:field="*{precoUnitario}"
                   th:classappend="${#fields.hasErrors('precoUnitario')} ? 'is-invalid'"
                   min="0.01" step="0.01" required />
            <div class="invalid-feedback" th:errors="*{precoUnitario}"></div>
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-outline-primary w-100">Adicionar Item</button>
          </div>
        </div>
      </form>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
