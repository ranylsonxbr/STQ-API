<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Editar Usuário</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('usuarios')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/usuarios}">Usuários</a>
      <span class="sep">/</span>
      <span class="cur">Editar Usuário</span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-card" style="max-width: 520px; margin: 0 auto;">
      <div class="stq-card-header">Editar Usuário</div>
      <div class="stq-card-body">
        <form th:action="@{/web/usuarios/{id}(id=${usuarioId})}" th:object="${usuarioForm}" method="post" novalidate>
          <div class="stq-form-group">
            <label for="nome" class="stq-label">Nome <span class="stq-req">*</span></label>
            <input type="text" id="nome" name="nome" class="stq-input"
                   th:field="*{nome}" th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid'"
                   maxlength="100" required />
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
          </div>
          <div class="stq-form-group">
            <label for="email" class="stq-label">E-mail <span class="stq-req">*</span></label>
            <input type="email" id="email" name="email" class="stq-input"
                   th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                   required />
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
          </div>
          <div class="stq-form-group">
            <label for="perfil" class="stq-label">Perfil <span class="stq-req">*</span></label>
            <select id="perfil" name="perfil" class="stq-select"
                    th:classappend="${#fields.hasErrors('perfil')} ? ' is-invalid'" required>
              <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"
                      th:selected="${p == __*{perfil}__}"></option>
            </select>
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></div>
          </div>
          <hr class="my-3" />
          <p class="stq-field-hint mb-2">Deixe os campos de senha em branco para manter a senha atual.</p>
          <div class="stq-form-group">
            <label for="novaSenha" class="stq-label">Nova Senha</label>
            <input type="password" id="novaSenha" name="novaSenha" class="stq-input"
                   th:field="*{novaSenha}" th:classappend="${#fields.hasErrors('novaSenha')} ? ' is-invalid'"
                   minlength="8" />
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('novaSenha')}" th:errors="*{novaSenha}"></div>
          </div>
          <div class="stq-form-group">
            <label for="confirmarNovaSenha" class="stq-label">Confirmar Nova Senha</label>
            <input type="password" id="confirmarNovaSenha" name="confirmarNovaSenha" class="stq-input"
                   th:field="*{confirmarNovaSenha}" th:classappend="${#fields.hasErrors('confirmarNovaSenha')} ? ' is-invalid'" />
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('confirmarNovaSenha')}" th:errors="*{confirmarNovaSenha}"></div>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <a th:href="@{/web/usuarios}" class="stq-btn-link">Cancelar</a>
            <button type="submit" class="stq-btn stq-btn-primary">
              <i data-lucide="save" class="stq-icon"></i> Salvar Alterações
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
