<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Usuários</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('usuarios')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <span class="stq-topbar-title">Usuários</span>
    <a th:href="@{/web/usuarios/novo}" class="stq-btn stq-btn-primary stq-btn-sm">
      <i data-lucide="user-plus" class="stq-icon"></i> Novo Usuário
    </a>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-table-wrap">
      <table class="stq-table">
        <thead>
          <tr>
            <th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${page.content}" th:classappend="${!u.ativo} ? 'stq-row-inactive'">
            <td th:text="${u.nome}"></td>
            <td th:text="${u.email}"></td>
            <td>
              <span class="stq-badge"
                    th:classappend="${u.perfil == 'ADMIN'} ? 'stq-badge-danger' : (${u.perfil == 'OPERADOR'} ? 'stq-badge-warning' : 'stq-badge-info')"
                    th:text="${u.perfil}"></span>
            </td>
            <td>
              <span class="stq-badge" th:classappend="${u.ativo} ? 'stq-badge-success' : 'stq-badge-default'">
                <span class="stq-badge-dot"></span>
                <span th:text="${u.ativo} ? 'Ativo' : 'Inativo'"></span>
              </span>
            </td>
            <td>
              <div class="stq-row-actions">
                <a th:href="@{/web/usuarios/{id}/editar(id=${u.id})}" class="stq-btn stq-btn-ghost stq-btn-sm"
                   title="Editar">
                  <i data-lucide="edit-2" class="stq-icon"></i>
                </a>
                <form th:action="@{/web/usuarios/{id}/desativar(id=${u.id})}" method="post"
                      th:if="${u.ativo}" onsubmit="return confirm('Desativar este usuário?')" class="d-inline">
                  <button type="submit" class="stq-btn stq-btn-ghost stq-btn-sm" title="Desativar">
                    <i data-lucide="ban" class="stq-icon"></i>
                  </button>
                </form>
                <form th:action="@{/web/usuarios/{id}/reativar(id=${u.id})}" method="post"
                      th:if="${!u.ativo}" onsubmit="return confirm('Reativar este usuário?')" class="d-inline">
                  <button type="submit" class="stq-btn stq-btn-ghost stq-btn-sm" title="Reativar">
                    <i data-lucide="user-check" class="stq-icon"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${page.content.empty}">
            <td colspan="5">
              <div class="stq-empty">
                <i data-lucide="users" class="stq-icon"></i>
                <p class="stq-empty-title">Nenhum usuário encontrado</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="stq-pagination" th:if="${page.totalPages > 1}">
        <a class="stq-page-btn" th:classappend="${page.first} ? 'disabled'"
           th:href="@{/web/usuarios(page=${page.number - 1},size=${page.size})}">
          <i data-lucide="chevron-left" class="stq-icon"></i> Anterior
        </a>
        <span class="stq-page-info"
              th:text="${'Pág. ' + (page.number + 1) + ' de ' + page.totalPages}"></span>
        <a class="stq-page-btn" th:classappend="${page.last} ? 'disabled'"
           th:href="@{/web/usuarios(page=${page.number + 1},size=${page.size})}">
          Próxima <i data-lucide="chevron-right" class="stq-icon"></i>
        </a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
