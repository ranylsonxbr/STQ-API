<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Criar Conta</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>

<div class="stq-login-layout">

  <div class="stq-login-left">
    <div class="stq-login-left-logo">
      <span class="stq-login-left-logo-mark">S</span>
      <span class="stq-login-left-logo-name">Stq</span>
    </div>
    <div class="stq-login-left-content">
      <p class="stq-login-tagline">Controle de estoque simples e rastreável.</p>
      <p class="stq-login-desc">
        Crie sua conta para acessar o sistema. Seu perfil inicial será
        <strong>Visualizador</strong> — para outras permissões, fale com o administrador.
      </p>
    </div>
    <p class="stq-login-copyright">© 2025 Stq</p>
  </div>

  <div class="stq-login-right">
    <div class="stq-login-form-wrap">
      <h2 class="stq-login-title">Criar Conta</h2>
      <p class="stq-login-subtitle">Preencha os dados para se cadastrar no sistema.</p>

      <form th:action="@{/web/usuarios/registro}" th:object="${registroForm}" method="post" novalidate>
        <div class="stq-form-group">
          <label for="nome" class="stq-label">Nome completo <span class="stq-req">*</span></label>
          <input type="text" id="nome" name="nome" class="stq-input"
                 th:field="*{nome}" th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid'"
                 maxlength="100" required autofocus />
          <div class="stq-invalid-msg" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        <div class="stq-form-group">
          <label for="email" class="stq-label">E-mail <span class="stq-req">*</span></label>
          <input type="email" id="email" name="email" class="stq-input"
                 th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                 required />
          <div class="stq-invalid-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="stq-form-group">
          <label for="senha" class="stq-label">Senha <span class="stq-req">*</span></label>
          <input type="password" id="senha" name="senha" class="stq-input"
                 th:field="*{senha}" th:classappend="${#fields.hasErrors('senha')} ? ' is-invalid'"
                 minlength="8" required placeholder="Mínimo 8 caracteres" />
          <div class="stq-invalid-msg" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
        </div>
        <div class="stq-form-group">
          <label for="confirmarSenha" class="stq-label">Confirmar Senha <span class="stq-req">*</span></label>
          <input type="password" id="confirmarSenha" name="confirmarSenha" class="stq-input"
                 th:field="*{confirmarSenha}" th:classappend="${#fields.hasErrors('confirmarSenha')} ? ' is-invalid'"
                 required />
          <div class="stq-invalid-msg" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></div>
        </div>
        <button type="submit" class="stq-btn stq-btn-primary stq-login-btn">
          <i data-lucide="user-plus" class="stq-icon"></i>
          Criar Conta
        </button>
      </form>

      <p class="stq-login-footer" style="margin-top: 16px;">
        Já tem conta? <a th:href="@{/web/login}" class="stq-link">Faça login</a>
      </p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
