<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Relatório de Movimentações</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/relatorios}">Relatórios</a></li>
      <li class="breadcrumb-item active">Movimentações</li>
    </ol>
  </nav>

  <h2 class="mb-3">Relatório de Movimentações</h2>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <!-- Filtros -->
  <form th:action="@{/web/relatorios/movimentacoes}" method="get" class="row g-2 mb-4">
    <div class="col-md-3">
      <label class="form-label small">De</label>
      <input type="date" name="de" class="form-control"
             th:value="${filtroDe}" />
    </div>
    <div class="col-md-3">
      <label class="form-label small">Até</label>
      <input type="date" name="ate" class="form-control"
             th:value="${filtroAte}" />
    </div>
    <div class="col-md-3">
      <label class="form-label small">Tipo</label>
      <select name="tipo" class="form-select">
        <option value="">Todos</option>
        <option th:each="t : ${tipos}"
                th:value="${t.name()}"
                th:text="${t.name()}"
                th:selected="${filtroTipo != null and filtroTipo == t.name()}"></option>
      </select>
    </div>
    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-outline-primary w-100">Filtrar</button>
    </div>
    <div class="col-md-1 d-flex align-items-end">
      <a th:href="@{/web/relatorios/movimentacoes}" class="btn btn-outline-secondary w-100">Limpar</a>
    </div>
  </form>

  <!-- Totais por tipo -->
  <div class="row g-3 mb-4" th:if="${relatorio != null and !relatorio.totais().empty}">
    <div class="col-md-3" th:each="t : ${relatorio.totais()}">
      <div class="card text-center">
        <div class="card-body">
          <h6 class="card-title" th:text="${t.tipo()}"></h6>
          <p class="display-6 fw-bold mb-0" th:text="${t.total()}"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabela -->
  <div class="table-responsive" th:if="${relatorio != null}">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>SKU</th>
          <th>Produto</th>
          <th>Tipo</th>
          <th>Origem</th>
          <th>Quantidade</th>
          <th>Realizado Em</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="m : ${relatorio.dados()}">
          <td th:text="${m.produtoSku}"></td>
          <td th:text="${m.produtoNome}"></td>
          <td>
            <span class="badge"
                  th:classappend="${m.tipo == 'ENTRADA'} ? 'bg-success' :
                                  (${m.tipo == 'SAIDA'} ? 'bg-warning text-dark' :
                                  (${m.tipo == 'AJUSTE'} ? 'bg-secondary' : 'bg-info text-dark'))"
                  th:text="${m.tipo}"></span>
          </td>
          <td th:text="${m.origem}"></td>
          <td th:text="${m.quantidade}"></td>
          <td th:text="${#temporals.format(m.realizadoEm, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr th:if="${relatorio.dados().empty}">
          <td colspan="6" class="text-center text-muted">Nenhuma movimentação encontrada para o período.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
