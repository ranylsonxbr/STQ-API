<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Relatório: Movimentações</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('relatorios')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/relatorios}">Relatórios</a>
      <span class="sep">/</span>
      <span class="cur">Movimentações</span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <form th:action="@{/web/relatorios/movimentacoes}" method="get" class="stq-filter-bar">
      <div>
        <label class="stq-label" style="margin-bottom:4px;">De</label>
        <input type="date" name="de" class="stq-input" th:value="${filtroDe}" style="width:160px;" />
      </div>
      <div>
        <label class="stq-label" style="margin-bottom:4px;">Até</label>
        <input type="date" name="ate" class="stq-input" th:value="${filtroAte}" style="width:160px;" />
      </div>
      <div>
        <label class="stq-label" style="margin-bottom:4px;">Tipo</label>
        <select name="tipo" class="stq-select" style="width:140px;">
          <option value="">Todos</option>
          <option th:each="t : ${tipos}" th:value="${t.name()}" th:text="${t.name()}"
                  th:selected="${filtroTipo != null and filtroTipo == t.name()}"></option>
        </select>
      </div>
      <div style="align-self:flex-end;">
        <button type="submit" class="stq-btn stq-btn-outline">Filtrar</button>
      </div>
      <div style="align-self:flex-end;">
        <a th:href="@{/web/relatorios/movimentacoes}" class="stq-btn stq-btn-ghost">Limpar</a>
      </div>
    </form>

    <!-- Totais por tipo -->
    <div class="row g-3 mb-3" th:if="${relatorio != null and !relatorio.totais().empty}">
      <div class="col-6 col-md-3" th:each="t : ${relatorio.totais()}">
        <div class="stq-stat-card">
          <div class="stq-stat-value" th:text="${t.quantidade()}"></div>
          <div class="stq-stat-label" th:text="${t.tipo()}"></div>
        </div>
      </div>
    </div>

    <div class="stq-table-wrap" th:if="${relatorio != null}">
      <table class="stq-table">
        <thead>
          <tr><th>SKU</th><th>Produto</th><th>Tipo</th><th>Origem</th><th>Quantidade</th><th>Realizado Em</th></tr>
        </thead>
        <tbody>
          <tr th:each="m : ${relatorio.dados()}">
            <td><span class="stq-code" th:text="${m.produtoSku}"></span></td>
            <td th:text="${m.produtoNome}"></td>
            <td>
              <span class="stq-badge"
                    th:classappend="${m.tipo == 'ENTRADA'} ? 'stq-badge-success' :
                                    (${m.tipo == 'SAIDA'} ? 'stq-badge-warning' :
                                    (${m.tipo == 'AJUSTE'} ? 'stq-badge-default' : 'stq-badge-info'))">
                <span class="stq-badge-dot"></span>
                <span th:text="${m.tipo}"></span>
              </span>
            </td>
            <td th:text="${m.origem}"></td>
            <td th:text="${m.quantidade}"></td>
            <td th:text="${#temporals.format(m.realizadoEm, 'dd/MM/yyyy HH:mm')}"></td>
          </tr>
          <tr th:if="${relatorio.dados().empty}">
            <td colspan="6">
              <div class="stq-empty"><p class="stq-empty-title">Nenhuma movimentação no período</p></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
