<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Relatório de Estoque Atual</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item"><a th:href="@{/web/relatorios}">Relatórios</a></li>
          <li class="breadcrumb-item active">Estoque Atual</li>
        </ol>
      </nav>
      <h2 class="mt-1">Estoque Atual</h2>
    </div>
    <a href="/estoque-ai/api/relatorios/estoque-atual"
       class="btn btn-outline-success btn-sm"
       th:hreflang="pt-BR"
       onclick="this.href='/estoque-ai/api/relatorios/estoque-atual'; return true;"
       target="_blank"
       title="Baixar CSV (use Accept: text/csv via API ou ferramenta REST)">
      Exportar via API (CSV)
    </a>
  </div>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>SKU</th>
          <th>Produto</th>
          <th>Unidade</th>
          <th>Saldo Atual</th>
          <th>Estoque Mínimo</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="i : ${itens}">
          <td th:text="${i.sku}"></td>
          <td th:text="${i.nomeProduto}"></td>
          <td th:text="${i.unidadeMedida}"></td>
          <td th:text="${i.saldoAtual}"></td>
          <td th:text="${i.estoqueMinimo}"></td>
          <td>
            <span class="badge"
                  th:classappend="${i.status.name() == 'NORMAL'} ? 'bg-success' :
                                  (${i.status.name() == 'ZERADO'} ? 'bg-danger' : 'bg-warning text-dark')"
                  th:text="${i.status}"></span>
          </td>
        </tr>
        <tr th:if="${itens.empty}">
          <td colspan="6" class="text-center text-muted">Nenhum item de estoque encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
