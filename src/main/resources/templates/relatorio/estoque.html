<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Relatório: Estoque Atual</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('relatorios')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/relatorios}">Relatórios</a>
      <span class="sep">/</span>
      <span class="cur">Estoque Atual</span>
    </nav>
    <a href="/estoque-ai/api/relatorios/estoque-atual" target="_blank"
       class="stq-btn stq-btn-outline stq-btn-sm">
      <i data-lucide="download" class="stq-icon"></i> Exportar CSV (API)
    </a>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-table-wrap">
      <table class="stq-table">
        <thead>
          <tr><th>SKU</th><th>Produto</th><th>Unidade</th><th>Saldo Atual</th><th>Est. Mínimo</th><th>Status</th></tr>
        </thead>
        <tbody>
          <tr th:each="i : ${itens}">
            <td><span class="stq-code" th:text="${i.sku}"></span></td>
            <td th:text="${i.nomeProduto}"></td>
            <td th:text="${i.unidadeMedida}"></td>
            <td th:text="${i.saldoAtual}"></td>
            <td th:text="${i.estoqueMinimo}"></td>
            <td>
              <span class="stq-badge"
                    th:classappend="${i.status.name() == 'NORMAL'} ? 'stq-badge-success' :
                                    (${i.status.name() == 'ZERADO'} ? 'stq-badge-danger' : 'stq-badge-warning')">
                <span class="stq-badge-dot"></span>
                <span th:text="${i.status}"></span>
              </span>
            </td>
          </tr>
          <tr th:if="${itens.empty}">
            <td colspan="6">
              <div class="stq-empty"><p class="stq-empty-title">Nenhum item encontrado</p></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
