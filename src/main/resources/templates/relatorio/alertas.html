<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Alertas de Estoque</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/relatorios}">Relatórios</a></li>
      <li class="breadcrumb-item active">Alertas de Estoque</li>
    </ol>
  </nav>

  <h2 class="mb-3">Alertas de Estoque</h2>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="alert alert-warning" role="alert" th:if="${!itens.empty}">
    <strong th:text="${itens.size()}"></strong> produto(s) com estoque zerado ou abaixo do mínimo.
  </div>
  <div class="alert alert-success" role="alert" th:if="${itens.empty}">
    Nenhum alerta no momento. Todos os produtos estão acima do estoque mínimo.
  </div>

  <div class="table-responsive" th:if="${!itens.empty}">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>SKU</th>
          <th>Produto</th>
          <th>Unidade</th>
          <th>Saldo Atual</th>
          <th>Estoque Mínimo</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="i : ${itens}">
          <td th:text="${i.sku}"></td>
          <td th:text="${i.nomeProduto}"></td>
          <td th:text="${i.unidadeMedida}"></td>
          <td>
            <span th:text="${i.saldoAtual}"
                  th:classappend="${i.saldoAtual == 0} ? 'text-danger fw-bold'"></span>
          </td>
          <td th:text="${i.estoqueMinimo}"></td>
          <td>
            <span class="badge"
                  th:classappend="${i.status.name() == 'ZERADO'} ? 'bg-danger' : 'bg-warning text-dark'"
                  th:text="${i.status}"></span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
