<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Alertas de Estoque</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('relatorios')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/relatorios}">Relatórios</a>
      <span class="sep">/</span>
      <span class="cur">Alertas de Estoque</span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-alert stq-alert-warning" th:if="${!itens.empty}">
      <i data-lucide="alert-triangle" class="stq-icon"></i>
      <strong th:text="${itens.size()}"></strong>&nbsp;produto(s) com estoque zerado ou abaixo do mínimo.
    </div>
    <div class="stq-alert stq-alert-success" th:if="${itens.empty}">
      <i data-lucide="check-circle" class="stq-icon"></i>
      Nenhum alerta no momento. Todos os produtos estão acima do mínimo.
    </div>

    <div class="stq-table-wrap" th:if="${!itens.empty}">
      <table class="stq-table">
        <thead>
          <tr><th>SKU</th><th>Produto</th><th>Unidade</th><th>Saldo Atual</th><th>Est. Mínimo</th><th>Status</th></tr>
        </thead>
        <tbody>
          <tr th:each="i : ${itens}">
            <td><span class="stq-code" th:text="${i.sku}"></span></td>
            <td th:text="${i.nomeProduto}"></td>
            <td th:text="${i.unidadeMedida}"></td>
            <td>
              <span th:text="${i.saldoAtual}"
                    th:style="${i.saldoAtual == 0} ? 'font-weight:700;color:#B91C1C;' : ''"></span>
            </td>
            <td th:text="${i.estoqueMinimo}"></td>
            <td>
              <span class="stq-badge"
                    th:classappend="${i.status.name() == 'ZERADO'} ? 'stq-badge-danger' : 'stq-badge-warning'">
                <span class="stq-badge-dot"></span>
                <span th:text="${i.status}"></span>
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
