<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Relatório de Pedidos de Compra</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/relatorios}">Relatórios</a></li>
      <li class="breadcrumb-item active">Pedidos de Compra</li>
    </ol>
  </nav>

  <h2 class="mb-3">Relatório de Pedidos de Compra</h2>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <!-- Filtros -->
  <form th:action="@{/web/relatorios/pedidos}" method="get" class="row g-2 mb-4">
    <div class="col-md-3">
      <label class="form-label small">De</label>
      <input type="date" name="de" class="form-control"
             th:value="${filtroDe}" />
    </div>
    <div class="col-md-3">
      <label class="form-label small">Até</label>
      <input type="date" name="ate" class="form-control"
             th:value="${filtroAte}" />
    </div>
    <div class="col-md-3">
      <label class="form-label small">Status</label>
      <select name="status" class="form-select">
        <option value="">Todos</option>
        <option th:each="s : ${statusPedido}"
                th:value="${s.name()}"
                th:text="${s.name()}"
                th:selected="${filtroStatus != null and filtroStatus == s.name()}"></option>
      </select>
    </div>
    <div class="col-md-2 d-flex align-items-end">
      <button type="submit" class="btn btn-outline-primary w-100">Filtrar</button>
    </div>
    <div class="col-md-1 d-flex align-items-end">
      <a th:href="@{/web/relatorios/pedidos}" class="btn btn-outline-secondary w-100">Limpar</a>
    </div>
  </form>

  <!-- Total gasto -->
  <div class="alert alert-info" th:if="${relatorio != null and relatorio.totalGasto() != null}">
    <strong>Total Gasto no Período:</strong>
    R$ <span th:text="${#numbers.formatDecimal(relatorio.totalGasto(), 1, 2)}"></span>
  </div>

  <!-- Tabela -->
  <div class="table-responsive" th:if="${relatorio != null}">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>Fornecedor</th>
          <th>Status</th>
          <th>Data Emissão</th>
          <th>Total do Pedido</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${relatorio.dados()}">
          <td th:text="${p.fornecedorNome}"></td>
          <td>
            <span class="badge"
                  th:classappend="${p.status == 'RASCUNHO'} ? 'bg-secondary' :
                                  (${p.status == 'PENDENTE'} ? 'bg-warning text-dark' :
                                  (${p.status == 'APROVADO'} ? 'bg-primary' :
                                  (${p.status == 'RECEBIDO'} ? 'bg-success' : 'bg-danger')))"
                  th:text="${p.status}"></span>
          </td>
          <td th:text="${p.dataEmissao}"></td>
          <td>R$ <span th:text="${#numbers.formatDecimal(p.totalPedido, 1, 2)}"></span></td>
          <td>
            <a th:href="@{/web/pedidos/{id}(id=${p.id})}" class="btn btn-outline-primary btn-sm">
              Detalhes
            </a>
          </td>
        </tr>
        <tr th:if="${relatorio.dados().empty}">
          <td colspan="5" class="text-center text-muted">Nenhum pedido encontrado para o período.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
