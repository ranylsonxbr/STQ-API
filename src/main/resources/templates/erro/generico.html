<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Erro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('dashboard')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <span class="stq-topbar-title">Erro</span>
  </header>
  <main class="stq-content">
    <div class="stq-error-wrap">
      <div class="stq-error-card">
        <p class="stq-error-code">Ops</p>
        <p class="stq-error-title">Ocorreu um erro</p>
        <p class="stq-error-desc" th:text="${mensagem}">Erro desconhecido.</p>
        <a th:href="@{/web/dashboard}" class="stq-btn stq-btn-primary">
          <i data-lucide="arrow-left" class="stq-icon"></i> Voltar ao Dashboard
        </a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
