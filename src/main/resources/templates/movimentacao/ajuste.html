<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Ajuste de Inventário</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('movimentacoes')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/movimentacoes}">Movimentações</a>
      <span class="sep">/</span>
      <span class="cur">Ajuste de Inventário</span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-alert stq-alert-warning" style="max-width: 560px;">
      <i data-lucide="alert-triangle" class="stq-icon"></i>
      Exclusivo para administradores (RN-09). O delta pode ser negativo.
    </div>

    <div class="stq-card" style="max-width: 560px; margin: 0 auto;">
      <div class="stq-card-header">Ajuste de Inventário</div>
      <div class="stq-card-body">
        <form th:action="@{/web/movimentacoes/ajuste}" th:object="${ajusteForm}" method="post" novalidate
              th:attr="data-variacoes-url=@{/web/movimentacoes/variacoes}">
          <div class="stq-form-group">
            <label for="produtoId" class="stq-label">Produto <span class="stq-req">*</span></label>
            <select id="produtoId" name="produtoId" class="stq-select"
                    th:classappend="${#fields.hasErrors('produtoId')} ? ' is-invalid'"
                    th:field="*{produtoId}" required onchange="stqCarregarVariacoes(this)">
              <option value="">Selecione um produto...</option>
              <option th:each="p : ${produtos}"
                      th:value="${p.id}"
                      th:text="${p.sku + ' — ' + p.nome}"></option>
            </select>
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('produtoId')}" th:errors="*{produtoId}"></div>
          </div>
          <div class="stq-form-group" id="variacaoGroup" style="display:none">
            <label for="variacaoId" class="stq-label">Variação</label>
            <select id="variacaoId" name="variacaoId" class="stq-select"
                    th:attr="data-selected=${ajusteForm.variacaoId}">
              <option value="">Sem variação</option>
            </select>
          </div>
          <div class="stq-form-group">
            <label for="localizacao" class="stq-label">Localização</label>
            <input type="text" id="localizacao" name="localizacao" class="stq-input"
                   th:field="*{localizacao}" maxlength="60" placeholder="Ex.: Prateleira A1" />
          </div>
          <div class="stq-form-group">
            <label for="delta" class="stq-label">Delta (variação) <span class="stq-req">*</span></label>
            <input type="number" id="delta" name="delta" class="stq-input"
                   th:field="*{delta}" th:classappend="${#fields.hasErrors('delta')} ? ' is-invalid'"
                   required />
            <p class="stq-field-hint">Positivo para incremento, negativo para decremento.</p>
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('delta')}" th:errors="*{delta}"></div>
          </div>
          <div class="stq-form-group">
            <label for="observacao" class="stq-label">Observação</label>
            <textarea id="observacao" name="observacao" class="stq-textarea"
                      th:field="*{observacao}" rows="3" maxlength="500"></textarea>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <a th:href="@{/web/movimentacoes}" class="stq-btn-link">Cancelar</a>
            <button type="submit" class="stq-btn stq-btn-primary">
              <i data-lucide="sliders" class="stq-icon"></i> Registrar Ajuste
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
lucide.createIcons();
async function stqCarregarVariacoes(produtoSel, preselect) {
  const form   = produtoSel.closest('form');
  const url    = form.dataset.variacoesUrl;
  const grupo  = document.getElementById('variacaoGroup');
  const sel    = document.getElementById('variacaoId');
  sel.innerHTML = '<option value="">Sem variação</option>';
  grupo.style.display = 'none';
  const produtoId = produtoSel.value;
  if (!produtoId) return;
  try {
    const vars = await fetch(url + '?produtoId=' + produtoId).then(r => r.json());
    if (vars.length > 0) {
      vars.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = v.skuVariacao + ' — ' + v.atributo + ': ' + v.valor;
        if (preselect && v.id === preselect) opt.selected = true;
        sel.appendChild(opt);
      });
      grupo.style.display = '';
    }
  } catch (e) { console.error(e); }
}
(function() {
  const s = document.getElementById('produtoId');
  if (s.value) stqCarregarVariacoes(s, document.getElementById('variacaoId').dataset.selected || null);
})();
</script>
</body>
</html>
