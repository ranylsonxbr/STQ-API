<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Ajuste de Inventário</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/movimentacoes}">Movimentações</a></li>
      <li class="breadcrumb-item active">Ajuste de Inventário</li>
    </ol>
  </nav>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="alert alert-warning" role="alert">
    <strong>Atenção:</strong> Ajustes de inventário são exclusivos para administradores (RN-09).
    Use com cautela — o campo delta pode ser negativo.
  </div>

  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">Ajuste de Inventário</h5>
    </div>
    <div class="card-body">
      <form th:action="@{/web/movimentacoes/ajuste}"
            th:object="${ajusteForm}"
            method="post"
            novalidate>

        <div class="mb-3">
          <label for="produtoId" class="form-label">ID do Produto <span class="text-danger">*</span></label>
          <input type="text" id="produtoId" name="produtoId" class="form-control"
                 th:field="*{produtoId}"
                 th:classappend="${#fields.hasErrors('produtoId')} ? 'is-invalid'"
                 placeholder="UUID do produto"
                 required />
          <div class="invalid-feedback" th:errors="*{produtoId}"></div>
        </div>

        <div class="mb-3">
          <label for="variacaoId" class="form-label">ID da Variação</label>
          <input type="text" id="variacaoId" name="variacaoId" class="form-control"
                 th:field="*{variacaoId}"
                 placeholder="UUID da variação (opcional)" />
        </div>

        <div class="mb-3">
          <label for="localizacao" class="form-label">Localização</label>
          <input type="text" id="localizacao" name="localizacao" class="form-control"
                 th:field="*{localizacao}"
                 th:classappend="${#fields.hasErrors('localizacao')} ? 'is-invalid'"
                 maxlength="60" placeholder="Ex.: Prateleira A1" />
          <div class="invalid-feedback" th:errors="*{localizacao}"></div>
        </div>

        <div class="mb-3">
          <label for="delta" class="form-label">Delta (variação) <span class="text-danger">*</span></label>
          <input type="number" id="delta" name="delta" class="form-control"
                 th:field="*{delta}"
                 th:classappend="${#fields.hasErrors('delta')} ? 'is-invalid'"
                 required />
          <div class="form-text">Informe um valor positivo para incremento ou negativo para decremento.</div>
          <div class="invalid-feedback" th:errors="*{delta}"></div>
        </div>

        <div class="mb-3">
          <label for="observacao" class="form-label">Observação</label>
          <textarea id="observacao" name="observacao" class="form-control"
                    th:field="*{observacao}"
                    th:classappend="${#fields.hasErrors('observacao')} ? 'is-invalid'"
                    rows="3" maxlength="500"></textarea>
          <div class="invalid-feedback" th:errors="*{observacao}"></div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-secondary">Registrar Ajuste</button>
          <a th:href="@{/web/movimentacoes}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
