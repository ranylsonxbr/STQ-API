<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Movimentações</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('movimentacoes')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <span class="stq-topbar-title">Movimentações de Estoque</span>
    <div class="d-flex gap-2" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
      <a th:href="@{/web/estoque}" class="stq-btn stq-btn-outline stq-btn-sm">
        <i data-lucide="layers" class="stq-icon"></i> Saldo
      </a>
      <a th:href="@{/web/movimentacoes/entrada}" class="stq-btn stq-btn-outline stq-btn-sm">
        <i data-lucide="arrow-down-circle" class="stq-icon"></i> Entrada
      </a>
      <a th:href="@{/web/movimentacoes/saida}" class="stq-btn stq-btn-outline stq-btn-sm">
        <i data-lucide="arrow-up-circle" class="stq-icon"></i> Saída
      </a>
      <a th:href="@{/web/movimentacoes/transferencia}" class="stq-btn stq-btn-outline stq-btn-sm">
        <i data-lucide="repeat" class="stq-icon"></i> Transferência
      </a>
      <a th:href="@{/web/movimentacoes/ajuste}" class="stq-btn stq-btn-outline stq-btn-sm"
         sec:authorize="hasRole('ADMIN')">
        <i data-lucide="sliders" class="stq-icon"></i> Ajuste
      </a>
    </div>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-table-wrap">
      <table class="stq-table">
        <thead>
          <tr>
            <th>SKU</th><th>Tipo</th><th>Origem</th><th>Qtd.</th>
            <th>Saldo Antes</th><th>Saldo Depois</th><th>Observação</th><th>Realizado Em</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="m : ${movimentacoes.content}">
            <td><span class="stq-code" th:text="${m.produtoSku}"></span></td>
            <td>
              <span class="stq-badge"
                    th:classappend="${m.tipo.name() == 'ENTRADA'} ? 'stq-badge-success' :
                                    (${m.tipo.name() == 'SAIDA'} ? 'stq-badge-warning' :
                                    (${m.tipo.name() == 'AJUSTE'} ? 'stq-badge-default' : 'stq-badge-info'))">
                <span class="stq-badge-dot"></span>
                <span th:text="${m.tipo}"></span>
              </span>
            </td>
            <td th:text="${m.origem}"></td>
            <td th:text="${m.quantidade}"></td>
            <td th:text="${m.saldoAntes}"></td>
            <td th:text="${m.saldoDepois}"></td>
            <td th:text="${m.observacao} ?: '—'" style="max-width:160px; overflow:hidden; text-overflow:ellipsis;"></td>
            <td th:text="${#temporals.format(m.realizadoEm, 'dd/MM/yyyy HH:mm')}"></td>
          </tr>
          <tr th:if="${movimentacoes.content.empty}">
            <td colspan="8">
              <div class="stq-empty">
                <i data-lucide="arrow-left-right" class="stq-icon"></i>
                <p class="stq-empty-title">Nenhuma movimentação encontrada</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="stq-pagination" th:if="${movimentacoes.totalPages > 1}">
        <a class="stq-page-btn" th:classappend="${movimentacoes.first} ? 'disabled'"
           th:href="@{/web/movimentacoes(page=${movimentacoes.number - 1},size=${movimentacoes.size})}">
          <i data-lucide="chevron-left" class="stq-icon"></i> Anterior
        </a>
        <span class="stq-page-info"
              th:text="${'Pág. ' + (movimentacoes.number + 1) + ' de ' + movimentacoes.totalPages}"></span>
        <a class="stq-page-btn" th:classappend="${movimentacoes.last} ? 'disabled'"
           th:href="@{/web/movimentacoes(page=${movimentacoes.number + 1},size=${movimentacoes.size})}">
          Próxima <i data-lucide="chevron-right" class="stq-icon"></i>
        </a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
