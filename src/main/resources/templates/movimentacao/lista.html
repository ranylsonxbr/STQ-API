<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Movimentações</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Movimentações de Estoque</h2>
    <div class="d-flex gap-2" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
      <a th:href="@{/web/movimentacoes/entrada}" class="btn btn-success btn-sm">+ Entrada</a>
      <a th:href="@{/web/movimentacoes/saida}" class="btn btn-warning btn-sm">+ Saída</a>
      <a th:href="@{/web/movimentacoes/transferencia}" class="btn btn-info btn-sm">+ Transferência</a>
      <a th:href="@{/web/movimentacoes/ajuste}" class="btn btn-secondary btn-sm"
         sec:authorize="hasRole('ADMIN')">+ Ajuste</a>
    </div>
  </div>

  <div class="mb-3">
    <a th:href="@{/web/estoque}" class="btn btn-outline-primary btn-sm">Ver Saldo de Estoque</a>
  </div>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>SKU</th>
          <th>Tipo</th>
          <th>Origem</th>
          <th>Quantidade</th>
          <th>Saldo Antes</th>
          <th>Saldo Depois</th>
          <th>Observação</th>
          <th>Realizado Em</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="m : ${movimentacoes.content}">
          <td th:text="${m.produtoSku}"></td>
          <td>
            <span class="badge"
                  th:classappend="${m.tipo.name() == 'ENTRADA'} ? 'bg-success' :
                                  (${m.tipo.name() == 'SAIDA'} ? 'bg-warning text-dark' :
                                  (${m.tipo.name() == 'AJUSTE'} ? 'bg-secondary' : 'bg-info text-dark'))"
                  th:text="${m.tipo}"></span>
          </td>
          <td th:text="${m.origem}"></td>
          <td th:text="${m.quantidade}"></td>
          <td th:text="${m.saldoAntes}"></td>
          <td th:text="${m.saldoDepois}"></td>
          <td th:text="${m.observacao} ?: '—'"></td>
          <td th:text="${#temporals.format(m.realizadoEm, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr th:if="${movimentacoes.content.empty}">
          <td colspan="8" class="text-center text-muted">Nenhuma movimentação encontrada.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${movimentacoes.totalPages > 1}">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${movimentacoes.first} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/movimentacoes(page=${movimentacoes.number - 1}, size=${movimentacoes.size})}">
          Anterior
        </a>
      </li>
      <li class="page-item disabled">
        <span class="page-link"
              th:text="${'Página ' + (movimentacoes.number + 1) + ' de ' + movimentacoes.totalPages}"></span>
      </li>
      <li class="page-item" th:classappend="${movimentacoes.last} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/movimentacoes(page=${movimentacoes.number + 1}, size=${movimentacoes.size})}">
          Próxima
        </a>
      </li>
    </ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
