<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Saldo de Estoque</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Saldo de Estoque</h2>
    <a th:href="@{/web/movimentacoes}" class="btn btn-outline-secondary btn-sm">
      Ver Movimentações
    </a>
  </div>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>SKU</th>
          <th>Localização</th>
          <th>Saldo Atual</th>
          <th>Estoque Mínimo</th>
          <th>Status</th>
          <th>Atualizado Em</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${estoques.content}">
          <td th:text="${e.produtoSku}"></td>
          <td th:text="${e.localizacao} ?: '—'"></td>
          <td th:text="${e.saldoAtual}"></td>
          <td th:text="${e.estoqueMinimo}"></td>
          <td>
            <span class="badge"
                  th:classappend="${e.status.name() == 'NORMAL'} ? 'bg-success' :
                                  (${e.status.name() == 'ZERADO'} ? 'bg-danger' : 'bg-warning text-dark')"
                  th:text="${e.status}"></span>
          </td>
          <td th:text="${#temporals.format(e.atualizadoEm, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        <tr th:if="${estoques.content.empty}">
          <td colspan="6" class="text-center text-muted">Nenhum registro de estoque encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${estoques.totalPages > 1}">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${estoques.first} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/estoque(page=${estoques.number - 1}, size=${estoques.size})}">
          Anterior
        </a>
      </li>
      <li class="page-item disabled">
        <span class="page-link"
              th:text="${'Página ' + (estoques.number + 1) + ' de ' + estoques.totalPages}"></span>
      </li>
      <li class="page-item" th:classappend="${estoques.last} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/estoque(page=${estoques.number + 1}, size=${estoques.size})}">
          Próxima
        </a>
      </li>
    </ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
