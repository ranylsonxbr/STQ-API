<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Saldo de Estoque</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('movimentacoes')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/movimentacoes}">Movimentações</a>
      <span class="sep">/</span>
      <span class="cur">Saldo de Estoque</span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-table-wrap">
      <table class="stq-table">
        <thead>
          <tr><th>SKU</th><th>Localização</th><th>Saldo Atual</th><th>Est. Mínimo</th><th>Status</th><th>Atualizado Em</th></tr>
        </thead>
        <tbody>
          <tr th:each="e : ${estoques.content}">
            <td><span class="stq-code" th:text="${e.produtoSku}"></span></td>
            <td th:text="${e.localizacao} ?: '—'"></td>
            <td th:text="${e.saldoAtual}"></td>
            <td th:text="${e.estoqueMinimo}"></td>
            <td>
              <span class="stq-badge"
                    th:classappend="${e.status.name() == 'NORMAL'} ? 'stq-badge-success' :
                                    (${e.status.name() == 'ZERADO'} ? 'stq-badge-danger' : 'stq-badge-warning')">
                <span class="stq-badge-dot"></span>
                <span th:text="${e.status}"></span>
              </span>
            </td>
            <td th:text="${#temporals.format(e.atualizadoEm, 'dd/MM/yyyy HH:mm')}"></td>
          </tr>
          <tr th:if="${estoques.content.empty}">
            <td colspan="6">
              <div class="stq-empty"><p class="stq-empty-title">Nenhum registro de estoque encontrado</p></div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="stq-pagination" th:if="${estoques.totalPages > 1}">
        <a class="stq-page-btn" th:classappend="${estoques.first} ? 'disabled'"
           th:href="@{/web/estoque(page=${estoques.number - 1},size=${estoques.size})}">
          <i data-lucide="chevron-left" class="stq-icon"></i> Anterior
        </a>
        <span class="stq-page-info" th:text="${'Pág. ' + (estoques.number + 1) + ' de ' + estoques.totalPages}"></span>
        <a class="stq-page-btn" th:classappend="${estoques.last} ? 'disabled'"
           th:href="@{/web/estoque(page=${estoques.number + 1},size=${estoques.size})}">
          Próxima <i data-lucide="chevron-right" class="stq-icon"></i>
        </a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
