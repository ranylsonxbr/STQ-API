<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Registrar Saída</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('movimentacoes')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/movimentacoes}">Movimentações</a>
      <span class="sep">/</span>
      <span class="cur">Registrar Saída</span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-alert stq-alert-warning" style="max-width: 560px;">
      <i data-lucide="alert-triangle" class="stq-icon"></i>
      Saídas que gerem saldo negativo serão rejeitadas (RN-01).
    </div>

    <div class="stq-card" style="max-width: 560px; margin: 0 auto;">
      <div class="stq-card-header">Registrar Saída de Estoque</div>
      <div class="stq-card-body">
        <form th:action="@{/web/movimentacoes/saida}" th:object="${saidaForm}" method="post" novalidate
              th:attr="data-variacoes-url=@{/web/movimentacoes/variacoes},data-saldos-url=@{/web/movimentacoes/saldos}">
          <div class="stq-form-group">
            <label for="produtoId" class="stq-label">Produto <span class="stq-req">*</span></label>
            <select id="produtoId" name="produtoId" class="stq-select"
                    th:classappend="${#fields.hasErrors('produtoId')} ? ' is-invalid'"
                    th:field="*{produtoId}" required onchange="stqCarregarVariacoes(this)">
              <option value="">Selecione um produto...</option>
              <option th:each="p : ${produtos}"
                      th:value="${p.id}"
                      th:text="${p.sku + ' — ' + p.nome}"></option>
            </select>
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('produtoId')}" th:errors="*{produtoId}"></div>
          </div>
          <div class="stq-form-group" id="variacaoGroup" style="display:none">
            <label for="variacaoId" class="stq-label">Variação</label>
            <select id="variacaoId" name="variacaoId" class="stq-select"
                    th:attr="data-selected=${saidaForm.variacaoId}"
                    onchange="stqAtualizarSaldosSelect(null)">
              <option value="">Sem variação</option>
            </select>
          </div>
          <div class="stq-form-group">
            <label for="localizacao" class="stq-label">Localização</label>
            <select id="localizacao" name="localizacao" class="stq-select"
                    th:attr="data-selected=${saidaForm.localizacao}">
              <option value="">Selecione um produto primeiro</option>
            </select>
          </div>
          <div class="stq-form-group">
            <label for="quantidade" class="stq-label">Quantidade <span class="stq-req">*</span></label>
            <input type="number" id="quantidade" name="quantidade" class="stq-input"
                   th:field="*{quantidade}" th:classappend="${#fields.hasErrors('quantidade')} ? ' is-invalid'"
                   min="1" required />
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}"></div>
          </div>
          <div class="stq-form-group">
            <label for="observacao" class="stq-label">Observação</label>
            <textarea id="observacao" name="observacao" class="stq-textarea"
                      th:field="*{observacao}" rows="3" maxlength="500"></textarea>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <a th:href="@{/web/movimentacoes}" class="stq-btn-link">Cancelar</a>
            <button type="submit" class="stq-btn stq-btn-primary">
              <i data-lucide="arrow-up-circle" class="stq-icon"></i> Registrar Saída
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
lucide.createIcons();
let _saldosTodos = [], _saldosProdutoId = null;

async function stqCarregarVariacoes(produtoSel, preselectVar) {
  const produtoId = produtoSel.value;
  const form      = produtoSel.closest('form');
  const varSel    = document.getElementById('variacaoId');
  const grupo     = document.getElementById('variacaoGroup');
  const locSel    = document.getElementById('localizacao');

  varSel.innerHTML = '<option value="">Sem variação</option>';
  grupo.style.display = 'none';
  _saldosTodos = []; _saldosProdutoId = null;

  if (!produtoId) {
    locSel.innerHTML = '<option value="">Selecione um produto primeiro</option>';
    return;
  }

  try {
    const vars = await fetch(form.dataset.variacoesUrl + '?produtoId=' + produtoId).then(r => r.json());
    if (vars.length > 0) {
      vars.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = v.skuVariacao + ' — ' + v.atributo + ': ' + v.valor;
        if (preselectVar && v.id === preselectVar) opt.selected = true;
        varSel.appendChild(opt);
      });
      grupo.style.display = '';
    }
  } catch (e) { console.error('Erro ao carregar variações:', e); }

  const preselectLoc = locSel.dataset.selected || null;
  await stqCarregarSaldos(produtoId, varSel.value, form.dataset.saldosUrl, preselectLoc);
}

async function stqAtualizarSaldosSelect(preselectLoc) {
  const produtoId  = document.getElementById('produtoId').value;
  const variacaoId = document.getElementById('variacaoId').value;
  const form       = document.querySelector('form[data-saldos-url]');
  await stqCarregarSaldos(produtoId, variacaoId, form ? form.dataset.saldosUrl : null, preselectLoc);
}

async function stqCarregarSaldos(produtoId, variacaoId, saldosUrl, preselectLoc) {
  const locSel = document.getElementById('localizacao');
  if (!produtoId || !saldosUrl) {
    locSel.innerHTML = '<option value="">Selecione um produto primeiro</option>';
    return;
  }
  if (_saldosProdutoId !== produtoId) {
    try {
      const resp = await fetch(saldosUrl + '?produtoId=' + produtoId);
      _saldosTodos = resp.ok ? await resp.json() : [];
      _saldosProdutoId = produtoId;
    } catch (e) {
      console.error('Erro ao carregar saldos:', e);
      _saldosTodos = [];
    }
  }
  const saldos = variacaoId
    ? _saldosTodos.filter(s => s.variacaoId === variacaoId)
    : _saldosTodos.filter(s => s.variacaoId === null);
  if (saldos.length === 0) {
    locSel.innerHTML = '<option value="">Nenhum estoque disponível</option>';
    return;
  }
  locSel.innerHTML = '';
  saldos.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.localizacao !== null ? s.localizacao : '';
    opt.textContent = (s.localizacao !== null ? s.localizacao : 'Sem localização') + ' — ' + s.saldoAtual + ' un.';
    if (preselectLoc && opt.value === preselectLoc) opt.selected = true;
    locSel.appendChild(opt);
  });
}

(function() {
  const s = document.getElementById('produtoId');
  if (s && s.value) {
    const varSel = document.getElementById('variacaoId');
    stqCarregarVariacoes(s, varSel ? varSel.dataset.selected || null : null);
  }
})();
</script>
</body>
</html>
