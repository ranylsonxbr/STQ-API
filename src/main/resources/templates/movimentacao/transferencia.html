<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Registrar Transferência</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('movimentacoes')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/movimentacoes}">Movimentações</a>
      <span class="sep">/</span>
      <span class="cur">Registrar Transferência</span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-card" style="max-width: 560px;">
      <div class="stq-card-header">Transferência entre Localizações</div>
      <div class="stq-card-body">
        <form th:action="@{/web/movimentacoes/transferencia}" th:object="${transferenciaForm}" method="post" novalidate>
          <div class="stq-form-group">
            <label for="produtoId" class="stq-label">ID do Produto <span class="stq-req">*</span></label>
            <input type="text" id="produtoId" name="produtoId" class="stq-input"
                   th:field="*{produtoId}" th:classappend="${#fields.hasErrors('produtoId')} ? ' is-invalid'"
                   placeholder="UUID do produto" required />
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('produtoId')}" th:errors="*{produtoId}"></div>
          </div>
          <div class="stq-form-group">
            <label for="variacaoId" class="stq-label">ID da Variação</label>
            <input type="text" id="variacaoId" name="variacaoId" class="stq-input"
                   th:field="*{variacaoId}" placeholder="UUID da variação (opcional)" />
          </div>
          <div class="stq-form-grid">
            <div class="stq-form-group">
              <label for="localizacaoOrigem" class="stq-label">Origem <span class="stq-req">*</span></label>
              <input type="text" id="localizacaoOrigem" name="localizacaoOrigem" class="stq-input"
                     th:field="*{localizacaoOrigem}"
                     th:classappend="${#fields.hasErrors('localizacaoOrigem')} ? ' is-invalid'"
                     maxlength="60" required />
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('localizacaoOrigem')}" th:errors="*{localizacaoOrigem}"></div>
            </div>
            <div class="stq-form-group">
              <label for="localizacaoDestino" class="stq-label">Destino <span class="stq-req">*</span></label>
              <input type="text" id="localizacaoDestino" name="localizacaoDestino" class="stq-input"
                     th:field="*{localizacaoDestino}"
                     th:classappend="${#fields.hasErrors('localizacaoDestino')} ? ' is-invalid'"
                     maxlength="60" required />
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('localizacaoDestino')}" th:errors="*{localizacaoDestino}"></div>
            </div>
          </div>
          <div class="stq-form-group">
            <label for="quantidade" class="stq-label">Quantidade <span class="stq-req">*</span></label>
            <input type="number" id="quantidade" name="quantidade" class="stq-input"
                   th:field="*{quantidade}" th:classappend="${#fields.hasErrors('quantidade')} ? ' is-invalid'"
                   min="1" required />
            <div class="stq-invalid-msg" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}"></div>
          </div>
          <div class="stq-form-group">
            <label for="observacao" class="stq-label">Observação</label>
            <textarea id="observacao" name="observacao" class="stq-textarea"
                      th:field="*{observacao}" rows="3" maxlength="500"></textarea>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <a th:href="@{/web/movimentacoes}" class="stq-btn-link">Cancelar</a>
            <button type="submit" class="stq-btn stq-btn-primary">
              <i data-lucide="repeat" class="stq-icon"></i> Registrar Transferência
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
