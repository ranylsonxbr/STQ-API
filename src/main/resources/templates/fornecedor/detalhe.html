<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Detalhe do Fornecedor</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/fornecedores}">Fornecedores</a></li>
      <li class="breadcrumb-item active" th:text="${fornecedor.razaoSocial}"></li>
    </ol>
  </nav>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0" th:text="${fornecedor.razaoSocial}">Razão Social</h4>
      <div class="d-flex gap-2" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
        <a th:href="@{/web/fornecedores/{id}/editar(id=${fornecedor.id})}"
           class="btn btn-outline-secondary btn-sm">Editar</a>
        <form th:action="@{/web/fornecedores/{id}/desativar(id=${fornecedor.id})}"
              method="post"
              th:if="${fornecedor.ativo}"
              sec:authorize="hasAnyRole('ADMIN','OPERADOR')"
              onsubmit="return confirm('Desativar este fornecedor?')">
          <button type="submit" class="btn btn-outline-danger btn-sm">Desativar</button>
        </form>
        <form th:action="@{/web/fornecedores/{id}/reativar(id=${fornecedor.id})}"
              method="post"
              th:if="${!fornecedor.ativo}"
              sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
          <button type="submit" class="btn btn-outline-success btn-sm">Reativar</button>
        </form>
      </div>
    </div>
    <div class="card-body">
      <dl class="row">
        <dt class="col-sm-3">CNPJ</dt>
        <dd class="col-sm-9" th:text="${fornecedor.cnpj}"></dd>

        <dt class="col-sm-3">E-mail</dt>
        <dd class="col-sm-9" th:text="${fornecedor.email} ?: '—'"></dd>

        <dt class="col-sm-3">Telefone</dt>
        <dd class="col-sm-9" th:text="${fornecedor.telefone} ?: '—'"></dd>

        <dt class="col-sm-3">Contato</dt>
        <dd class="col-sm-9" th:text="${fornecedor.contato} ?: '—'"></dd>

        <dt class="col-sm-3">Status</dt>
        <dd class="col-sm-9">
          <span class="badge"
                th:classappend="${fornecedor.ativo} ? 'bg-success' : 'bg-secondary'"
                th:text="${fornecedor.ativo} ? 'Ativo' : 'Inativo'"></span>
        </dd>

        <dt class="col-sm-3">Criado em</dt>
        <dd class="col-sm-9" th:text="${#temporals.format(fornecedor.criadoEm, 'dd/MM/yyyy HH:mm')}"></dd>

        <dt class="col-sm-3" th:if="${fornecedor.atualizadoEm != null}">Atualizado em</dt>
        <dd class="col-sm-9" th:if="${fornecedor.atualizadoEm != null}"
            th:text="${#temporals.format(fornecedor.atualizadoEm, 'dd/MM/yyyy HH:mm')}"></dd>
      </dl>
    </div>
  </div>

  <div class="mt-3">
    <a th:href="@{/web/fornecedores}" class="btn btn-outline-secondary">Voltar</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
