<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Fornecedores</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('fornecedores')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <span class="stq-topbar-title">Fornecedores</span>
    <a th:href="@{/web/fornecedores/novo}" class="stq-btn stq-btn-primary stq-btn-sm"
       sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
      <i data-lucide="plus" class="stq-icon"></i> Novo Fornecedor
    </a>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <form th:action="@{/web/fornecedores}" method="get" class="stq-filter-bar">
      <div class="stq-input-icon" style="flex:1; min-width:200px;">
        <i data-lucide="search" class="stq-icon"></i>
        <input type="text" name="razaoSocial" class="stq-input" placeholder="Razão Social..."
               th:value="${filtroRazaoSocial}" />
      </div>
      <input type="text" name="cnpj" class="stq-input" placeholder="CNPJ"
             th:value="${filtroCnpj}" style="width:160px;" />
      <select name="ativo" class="stq-select" style="width:120px;">
        <option value="">Todos</option>
        <option value="true"  th:selected="${filtroAtivo == true}">Ativos</option>
        <option value="false" th:selected="${filtroAtivo == false}">Inativos</option>
      </select>
      <button type="submit" class="stq-btn stq-btn-outline">Filtrar</button>
      <a th:href="@{/web/fornecedores}" class="stq-btn stq-btn-ghost">Limpar</a>
    </form>

    <div class="stq-table-wrap">
      <table class="stq-table">
        <thead>
          <tr>
            <th>Razão Social</th><th>CNPJ</th><th>E-mail</th><th>Contato</th><th>Status</th>
            <th sec:authorize="hasAnyRole('ADMIN','OPERADOR')"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="f : ${fornecedores.content}">
            <td><a th:href="@{/web/fornecedores/{id}(id=${f.id})}" th:text="${f.razaoSocial}" class="stq-link"></a></td>
            <td th:text="${f.cnpj}"></td>
            <td th:text="${f.email} ?: '—'"></td>
            <td th:text="${f.contato} ?: '—'"></td>
            <td>
              <span class="stq-badge" th:classappend="${f.ativo} ? 'stq-badge-success' : 'stq-badge-default'">
                <span class="stq-badge-dot"></span>
                <span th:text="${f.ativo} ? 'Ativo' : 'Inativo'"></span>
              </span>
            </td>
            <td sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
              <div class="stq-row-actions">
                <a th:href="@{/web/fornecedores/{id}/editar(id=${f.id})}" class="stq-btn stq-btn-ghost stq-btn-sm">
                  <i data-lucide="edit-2" class="stq-icon"></i>
                </a>
                <form th:action="@{/web/fornecedores/{id}/desativar(id=${f.id})}" method="post"
                      th:if="${f.ativo}" onsubmit="return confirm('Desativar este fornecedor?')" class="d-inline">
                  <button type="submit" class="stq-btn stq-btn-ghost stq-btn-sm">
                    <i data-lucide="ban" class="stq-icon"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${fornecedores.content.empty}">
            <td colspan="6">
              <div class="stq-empty">
                <i data-lucide="building-2" class="stq-icon"></i>
                <p class="stq-empty-title">Nenhum fornecedor encontrado</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="stq-pagination" th:if="${fornecedores.totalPages > 1}">
        <a class="stq-page-btn" th:classappend="${fornecedores.first} ? 'disabled'"
           th:href="@{/web/fornecedores(page=${fornecedores.number - 1},size=${fornecedores.size},razaoSocial=${filtroRazaoSocial},cnpj=${filtroCnpj},ativo=${filtroAtivo})}">
          <i data-lucide="chevron-left" class="stq-icon"></i> Anterior
        </a>
        <span class="stq-page-info"
              th:text="${'Pág. ' + (fornecedores.number + 1) + ' de ' + fornecedores.totalPages}"></span>
        <a class="stq-page-btn" th:classappend="${fornecedores.last} ? 'disabled'"
           th:href="@{/web/fornecedores(page=${fornecedores.number + 1},size=${fornecedores.size},razaoSocial=${filtroRazaoSocial},cnpj=${filtroCnpj},ativo=${filtroAtivo})}">
          Próxima <i data-lucide="chevron-right" class="stq-icon"></i>
        </a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
