<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Fornecedores</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Fornecedores</h2>
    <a th:href="@{/web/fornecedores/novo}" class="btn btn-primary btn-sm"
       sec:authorize="hasAnyRole('ADMIN','OPERADOR')">+ Novo Fornecedor</a>
  </div>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <!-- Filtros -->
  <form th:action="@{/web/fornecedores}" method="get" class="row g-2 mb-4">
    <div class="col-md-4">
      <input type="text" name="razaoSocial" class="form-control" placeholder="Razão Social"
             th:value="${filtroRazaoSocial}" />
    </div>
    <div class="col-md-3">
      <input type="text" name="cnpj" class="form-control" placeholder="CNPJ"
             th:value="${filtroCnpj}" />
    </div>
    <div class="col-md-2">
      <select name="ativo" class="form-select">
        <option value="">Todos</option>
        <option value="true" th:selected="${filtroAtivo == true}">Ativos</option>
        <option value="false" th:selected="${filtroAtivo == false}">Inativos</option>
      </select>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-outline-primary w-100">Filtrar</button>
    </div>
    <div class="col-md-1">
      <a th:href="@{/web/fornecedores}" class="btn btn-outline-secondary w-100">Limpar</a>
    </div>
  </form>

  <!-- Tabela -->
  <div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>Razão Social</th>
          <th>CNPJ</th>
          <th>E-mail</th>
          <th>Contato</th>
          <th>Ativo</th>
          <th sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="f : ${fornecedores.content}">
          <td>
            <a th:href="@{/web/fornecedores/{id}(id=${f.id})}" th:text="${f.razaoSocial}"></a>
          </td>
          <td th:text="${f.cnpj}"></td>
          <td th:text="${f.email} ?: '—'"></td>
          <td th:text="${f.contato} ?: '—'"></td>
          <td>
            <span class="badge"
                  th:classappend="${f.ativo} ? 'bg-success' : 'bg-secondary'"
                  th:text="${f.ativo} ? 'Ativo' : 'Inativo'"></span>
          </td>
          <td sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
            <div class="d-flex gap-1">
              <a th:href="@{/web/fornecedores/{id}/editar(id=${f.id})}"
                 class="btn btn-outline-secondary btn-sm">Editar</a>
              <form th:action="@{/web/fornecedores/{id}/desativar(id=${f.id})}"
                    method="post"
                    th:if="${f.ativo}"
                    onsubmit="return confirm('Desativar este fornecedor?')">
                <button type="submit" class="btn btn-outline-danger btn-sm">Desativar</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${fornecedores.content.empty}">
          <td colspan="6" class="text-center text-muted">Nenhum fornecedor encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginação -->
  <nav th:if="${fornecedores.totalPages > 1}">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${fornecedores.first} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/fornecedores(page=${fornecedores.number - 1}, size=${fornecedores.size}, razaoSocial=${filtroRazaoSocial}, cnpj=${filtroCnpj}, ativo=${filtroAtivo})}">
          Anterior
        </a>
      </li>
      <li class="page-item disabled">
        <span class="page-link"
              th:text="${'Página ' + (fornecedores.number + 1) + ' de ' + fornecedores.totalPages}"></span>
      </li>
      <li class="page-item" th:classappend="${fornecedores.last} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/fornecedores(page=${fornecedores.number + 1}, size=${fornecedores.size}, razaoSocial=${filtroRazaoSocial}, cnpj=${filtroCnpj}, ativo=${filtroAtivo})}">
          Próxima
        </a>
      </li>
    </ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
