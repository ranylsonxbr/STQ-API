<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${editando} ? 'estoque-ai — Editar Fornecedor' : 'estoque-ai — Novo Fornecedor'">
    estoque-ai — Fornecedor
  </title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/fornecedores}">Fornecedores</a></li>
      <li class="breadcrumb-item active"
          th:text="${editando} ? 'Editar' : 'Novo Fornecedor'"></li>
    </ol>
  </nav>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="card">
    <div class="card-header">
      <h5 class="mb-0" th:text="${editando} ? 'Editar Fornecedor' : 'Novo Fornecedor'"></h5>
    </div>
    <div class="card-body">
      <form th:action="${editando} ? @{/web/fornecedores/{id}(id=${fornecedorId})} : @{/web/fornecedores}"
            th:object="${fornecedorForm}"
            method="post"
            novalidate>

        <div class="mb-3">
          <label for="razaoSocial" class="form-label">Razão Social <span class="text-danger">*</span></label>
          <input type="text" id="razaoSocial" name="razaoSocial" class="form-control"
                 th:field="*{razaoSocial}"
                 th:classappend="${#fields.hasErrors('razaoSocial')} ? 'is-invalid'"
                 required minlength="3" maxlength="150" />
          <div class="invalid-feedback" th:errors="*{razaoSocial}"></div>
        </div>

        <div class="mb-3">
          <label for="cnpj" class="form-label">CNPJ <span class="text-danger">*</span></label>
          <input type="text" id="cnpj" name="cnpj" class="form-control"
                 th:field="*{cnpj}"
                 th:classappend="${#fields.hasErrors('cnpj')} ? 'is-invalid'"
                 placeholder="00.000.000/0000-00"
                 required />
          <div class="invalid-feedback" th:errors="*{cnpj}"></div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" name="email" class="form-control"
                 th:field="*{email}"
                 th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
          <label for="telefone" class="form-label">Telefone</label>
          <input type="text" id="telefone" name="telefone" class="form-control"
                 th:field="*{telefone}" />
        </div>

        <div class="mb-3">
          <label for="contato" class="form-label">Nome do Contato</label>
          <input type="text" id="contato" name="contato" class="form-control"
                 th:field="*{contato}" />
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a th:href="@{/web/fornecedores}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
