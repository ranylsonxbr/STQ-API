<!DOCTYPE html>
<!--
  Padrão de layout escolhido: FRAGMENTOS THYMELEAF NATIVOS (sem thymeleaf-layout-dialect).
  A navbar é um fragmento reutilizável (th:fragment="navbar").
  Cada página inclui a navbar via:
    <div th:replace="~{layout/base :: navbar}"></div>
  e define seu próprio <html>/<head>/<body> com Bootstrap 5 via CDN.
  O fragmento "alertas" está em layout/fragments/alertas.html.
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${titulo} ?: 'estoque-ai'">estoque-ai</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<!-- FRAGMENTO: navbar — inclua em cada página via th:replace="~{layout/base :: navbar}" -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" th:href="@{/web/dashboard}">estoque-ai</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/web/dashboard}">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/web/produtos}">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/web/fornecedores}">Fornecedores</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/web/movimentacoes}">Movimentações</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/web/pedidos}">Pedidos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/web/relatorios}">Relatórios</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white" th:text="${nomeUsuario}"></span>
        <span class="badge bg-secondary" th:text="${perfilUsuario}"></span>
        <form th:action="@{/web/logout}" method="post" class="d-inline">
          <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
