<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('dashboard')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <span class="stq-topbar-title">Dashboard</span>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="row g-3 mb-4">
      <div class="col-sm-6 col-xl-3">
        <div class="stq-stat-card">
          <div class="stq-stat-value" th:text="${totalProdutosAtivos}">0</div>
          <div class="stq-stat-label">Produtos ativos</div>
          <span class="stq-stat-dot stq-dot-ok"></span>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stq-stat-card">
          <div class="stq-stat-value" th:text="${totalFornecedoresAtivos}">0</div>
          <div class="stq-stat-label">Fornecedores ativos</div>
          <span class="stq-stat-dot stq-dot-info"></span>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stq-stat-card">
          <div class="stq-stat-value" th:text="${totalPedidosAbertos}">0</div>
          <div class="stq-stat-label">Pedidos em aberto</div>
          <span class="stq-stat-dot stq-dot-warn"></span>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="stq-stat-card">
          <div class="stq-stat-value" th:text="${totalAlertas}">0</div>
          <div class="stq-stat-label">Alertas de estoque</div>
          <span class="stq-stat-dot stq-dot-danger"></span>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
