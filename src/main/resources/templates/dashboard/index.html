<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Dashboard</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <h2 class="mb-4">Dashboard</h2>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="row g-4">

    <div class="col-md-3">
      <div class="card text-bg-primary h-100">
        <div class="card-body">
          <h5 class="card-title">Produtos Ativos</h5>
          <p class="display-6 fw-bold" th:text="${totalProdutosAtivos}">0</p>
          <a th:href="@{/web/produtos}" class="btn btn-light btn-sm mt-2">Ver Produtos</a>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-bg-success h-100">
        <div class="card-body">
          <h5 class="card-title">Fornecedores Ativos</h5>
          <p class="display-6 fw-bold" th:text="${totalFornecedoresAtivos}">0</p>
          <a th:href="@{/web/fornecedores}" class="btn btn-light btn-sm mt-2">Ver Fornecedores</a>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-bg-warning h-100">
        <div class="card-body">
          <h5 class="card-title">Pedidos em Aberto</h5>
          <p class="display-6 fw-bold" th:text="${totalPedidosAbertos}">0</p>
          <a th:href="@{/web/pedidos}" class="btn btn-light btn-sm mt-2">Ver Pedidos</a>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-bg-danger h-100">
        <div class="card-body">
          <h5 class="card-title">Alertas de Estoque</h5>
          <p class="display-6 fw-bold" th:text="${totalAlertas}">0</p>
          <a th:href="@{/web/relatorios}" class="btn btn-light btn-sm mt-2">Ver Relatórios</a>
        </div>
      </div>
    </div>

  </div>

  <div class="row mt-5">
    <div class="col-12">
      <h5>Atalhos Rápidos</h5>
      <div class="d-flex flex-wrap gap-2 mt-2">
        <a th:href="@{/web/produtos}" class="btn btn-outline-primary">Produtos</a>
        <a th:href="@{/web/fornecedores}" class="btn btn-outline-success">Fornecedores</a>
        <a th:href="@{/web/movimentacoes}" class="btn btn-outline-secondary">Estoque / Movimentações</a>
        <a th:href="@{/web/pedidos}" class="btn btn-outline-warning">Pedidos de Compra</a>
        <a th:href="@{/web/relatorios}" class="btn btn-outline-danger">Relatórios</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
