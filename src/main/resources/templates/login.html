<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Login</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
  <style>
    body { background-color: #f8f9fa; }
    .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="card shadow" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4">
      <h4 class="card-title text-center mb-4 fw-bold">estoque-ai</h4>

      <div class="alert alert-danger" th:if="${param.erro}">
        E-mail ou senha inválidos.
      </div>
      <div class="alert alert-success" th:if="${param.logout}">
        Logout realizado com sucesso.
      </div>

      <form th:action="@{/web/login}" method="post">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email"
                 id="email"
                 name="email"
                 class="form-control"
                 placeholder="seu@email.com"
                 required
                 autofocus />
        </div>
        <div class="mb-4">
          <label for="senha" class="form-label">Senha</label>
          <input type="password"
                 id="senha"
                 name="senha"
                 class="form-control"
                 placeholder="••••••••"
                 required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
