<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${editando} ? 'estoque-ai — Editar Produto' : 'estoque-ai — Novo Produto'">
    estoque-ai — Produto
  </title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/produtos}">Produtos</a></li>
      <li class="breadcrumb-item active"
          th:text="${editando} ? 'Editar' : 'Novo Produto'"></li>
    </ol>
  </nav>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="card">
    <div class="card-header">
      <h5 class="mb-0" th:text="${editando} ? 'Editar Produto' : 'Novo Produto'"></h5>
    </div>
    <div class="card-body">
      <form th:action="${editando} ? @{/web/produtos/{id}(id=${produtoId})} : @{/web/produtos}"
            th:object="${produtoForm}"
            method="post"
            novalidate>

        <div class="mb-3">
          <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
          <input type="text" id="nome" name="nome" class="form-control"
                 th:field="*{nome}"
                 th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                 required minlength="3" maxlength="120" />
          <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição</label>
          <textarea id="descricao" name="descricao" class="form-control"
                    th:field="*{descricao}"
                    th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"
                    rows="3" maxlength="1000"></textarea>
          <div class="invalid-feedback" th:errors="*{descricao}"></div>
        </div>

        <div class="mb-3">
          <label for="categoriaId" class="form-label">Categoria <span class="text-danger">*</span></label>
          <select id="categoriaId" name="categoriaId" class="form-select"
                  th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid'"
                  required>
            <option value="">Selecione uma categoria...</option>
            <option th:each="cat : ${categorias}"
                    th:value="${cat.id}"
                    th:text="${cat.nome}"
                    th:selected="${cat.id == produtoForm.categoriaId}">
            </option>
          </select>
          <div class="invalid-feedback" th:errors="*{categoriaId}"></div>
        </div>

        <div class="mb-3">
          <label for="unidadeMedida" class="form-label">Unidade de Medida <span class="text-danger">*</span></label>
          <select id="unidadeMedida" name="unidadeMedida" class="form-select"
                  th:classappend="${#fields.hasErrors('unidadeMedida')} ? 'is-invalid'"
                  required>
            <option value="">Selecione...</option>
            <option th:each="un : ${unidades}"
                    th:value="${un.name()}"
                    th:text="${un.name()}"
                    th:selected="${un.name() == produtoForm.unidadeMedida}">
            </option>
          </select>
          <div class="invalid-feedback" th:errors="*{unidadeMedida}"></div>
        </div>

        <div class="mb-3">
          <label for="estoqueMinimo" class="form-label">Estoque Mínimo</label>
          <input type="number" id="estoqueMinimo" name="estoqueMinimo" class="form-control"
                 th:field="*{estoqueMinimo}"
                 th:classappend="${#fields.hasErrors('estoqueMinimo')} ? 'is-invalid'"
                 min="0" />
          <div class="invalid-feedback" th:errors="*{estoqueMinimo}"></div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a th:href="@{/web/produtos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
