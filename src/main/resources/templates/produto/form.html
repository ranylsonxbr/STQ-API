<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${editando} ? 'Stq — Editar Produto' : 'Stq — Novo Produto'">Stq — Produto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('produtos')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/produtos}">Produtos</a>
      <span class="sep">/</span>
      <span class="cur" th:text="${editando} ? 'Editar Produto' : 'Novo Produto'"></span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="stq-card" style="max-width: 640px; margin: 0 auto;">
      <div class="stq-card-header" th:text="${editando} ? 'Editar Produto' : 'Informações do produto'"></div>
      <div class="stq-card-body">
        <form th:action="${editando} ? @{/web/produtos/{id}(id=${produtoId})} : @{/web/produtos}"
              th:object="${produtoForm}" method="post" novalidate>

          <div class="stq-form-grid">
            <div class="stq-form-group">
              <label for="nome" class="stq-label">Nome <span class="stq-req">*</span></label>
              <input type="text" id="nome" name="nome" class="stq-input"
                     th:field="*{nome}"
                     th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid'"
                     required minlength="3" maxlength="120" />
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="stq-form-group">
              <label for="categoriaId" class="stq-label">Categoria <span class="stq-req">*</span></label>
              <select id="categoriaId" name="categoriaId" class="stq-select"
                      th:classappend="${#fields.hasErrors('categoriaId')} ? ' is-invalid'" required>
                <option value="">Selecione uma categoria...</option>
                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"
                        th:selected="${cat.id == produtoForm.categoriaId}"></option>
              </select>
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
            </div>

            <div class="stq-form-group">
              <label for="unidadeMedida" class="stq-label">Unidade de Medida <span class="stq-req">*</span></label>
              <select id="unidadeMedida" name="unidadeMedida" class="stq-select"
                      th:classappend="${#fields.hasErrors('unidadeMedida')} ? ' is-invalid'" required>
                <option value="">Selecione...</option>
                <option th:each="un : ${unidades}" th:value="${un.name()}" th:text="${un.name()}"
                        th:selected="${un.name() == produtoForm.unidadeMedida}"></option>
              </select>
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('unidadeMedida')}" th:errors="*{unidadeMedida}"></div>
            </div>

            <div class="stq-form-group">
              <label for="estoqueMinimo" class="stq-label">Estoque Mínimo</label>
              <input type="number" id="estoqueMinimo" name="estoqueMinimo" class="stq-input"
                     th:field="*{estoqueMinimo}"
                     th:classappend="${#fields.hasErrors('estoqueMinimo')} ? ' is-invalid'"
                     min="0" />
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('estoqueMinimo')}" th:errors="*{estoqueMinimo}"></div>
            </div>

            <div class="stq-form-group stq-form-full">
              <label for="descricao" class="stq-label">Descrição</label>
              <textarea id="descricao" name="descricao" class="stq-textarea"
                        th:field="*{descricao}"
                        th:classappend="${#fields.hasErrors('descricao')} ? ' is-invalid'"
                        rows="3" maxlength="1000"></textarea>
              <div class="stq-invalid-msg" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center" style="margin-top: 8px;">
            <a th:href="@{/web/produtos}" class="stq-btn-link">Cancelar</a>
            <button type="submit" class="stq-btn stq-btn-primary">
              <i data-lucide="save" class="stq-icon"></i>
              <span th:text="${editando} ? 'Salvar alterações' : 'Criar Produto'">Salvar</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
