<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Categorias</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('produtos')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <nav class="stq-topbar-breadcrumb">
      <a th:href="@{/web/produtos}">Produtos</a>
      <span class="sep">/</span>
      <span class="cur">Categorias</span>
    </nav>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="stq-table-wrap">
          <table class="stq-table">
            <thead>
              <tr><th>Nome</th><th>Categoria Pai</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr th:each="cat : ${categorias}">
                <td th:text="${cat.nome}"></td>
                <td th:text="${cat.categoriaPaiId} ?: '—'"></td>
                <td>
                  <span class="stq-badge"
                        th:classappend="${cat.ativo} ? 'stq-badge-success' : 'stq-badge-default'">
                    <span class="stq-badge-dot"></span>
                    <span th:text="${cat.ativo} ? 'Ativa' : 'Inativa'"></span>
                  </span>
                </td>
              </tr>
              <tr th:if="${categorias.empty}">
                <td colspan="3">
                  <div class="stq-empty">
                    <p class="stq-empty-title">Nenhuma categoria cadastrada</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="col-lg-5" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
        <div class="stq-card">
          <div class="stq-card-header">Nova Categoria</div>
          <div class="stq-card-body">
            <form th:action="@{/web/produtos/categorias}" th:object="${categoriaForm}"
                  method="post" novalidate>
              <div class="stq-form-group">
                <label for="nome" class="stq-label">Nome <span class="stq-req">*</span></label>
                <input type="text" id="nome" name="nome" class="stq-input"
                       th:field="*{nome}"
                       th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid'"
                       required minlength="2" maxlength="60" />
                <div class="stq-invalid-msg" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
              </div>
              <div class="stq-form-group">
                <label for="categoriaPaiId" class="stq-label">Categoria Pai (opcional)</label>
                <select id="categoriaPaiId" name="categoriaPaiId" class="stq-select">
                  <option value="">Nenhuma</option>
                  <option th:each="cat : ${categorias}" th:if="${cat.ativo}"
                          th:value="${cat.id}" th:text="${cat.nome}"></option>
                </select>
              </div>
              <button type="submit" class="stq-btn stq-btn-primary" style="width: 100%;">
                Criar Categoria
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
