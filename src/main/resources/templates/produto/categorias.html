<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Categorias</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/web/produtos}">Produtos</a></li>
      <li class="breadcrumb-item active">Categorias</li>
    </ol>
  </nav>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <div class="row">
    <div class="col-md-8">
      <h4 class="mb-3">Categorias</h4>
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>Nome</th>
              <th>Categoria Pai</th>
              <th>Ativo</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="cat : ${categorias}">
              <td th:text="${cat.nome}"></td>
              <td th:text="${cat.categoriaPaiId} ?: '—'"></td>
              <td>
                <span class="badge"
                      th:classappend="${cat.ativo} ? 'bg-success' : 'bg-secondary'"
                      th:text="${cat.ativo} ? 'Ativa' : 'Inativa'"></span>
              </td>
            </tr>
            <tr th:if="${categorias.empty}">
              <td colspan="3" class="text-center text-muted">Nenhuma categoria cadastrada.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="col-md-4" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
      <h5 class="mb-3">Nova Categoria</h5>
      <div class="card">
        <div class="card-body">
          <form th:action="@{/web/produtos/categorias}"
                th:object="${categoriaForm}"
                method="post"
                novalidate>

            <div class="mb-3">
              <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
              <input type="text" id="nome" name="nome" class="form-control"
                     th:field="*{nome}"
                     th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                     required minlength="2" maxlength="60" />
              <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>

            <div class="mb-3">
              <label for="categoriaPaiId" class="form-label">Categoria Pai (opcional)</label>
              <select id="categoriaPaiId" name="categoriaPaiId" class="form-select">
                <option value="">Nenhuma</option>
                <option th:each="cat : ${categorias}"
                        th:if="${cat.ativo}"
                        th:value="${cat.id}"
                        th:text="${cat.nome}">
                </option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Criar Categoria</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
