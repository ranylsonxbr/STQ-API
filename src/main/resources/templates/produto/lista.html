<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stq — Produtos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="stq-layout">

<aside th:replace="~{layout/base :: sidebar('produtos')}"></aside>

<div class="stq-main">
  <header class="stq-topbar">
    <span class="stq-topbar-title">Produtos</span>
    <div class="d-flex gap-2" sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
      <a th:href="@{/web/produtos/categorias}" class="stq-btn stq-btn-outline stq-btn-sm">
        <i data-lucide="tag" class="stq-icon"></i> Categorias
      </a>
      <a th:href="@{/web/produtos/novo}" class="stq-btn stq-btn-primary stq-btn-sm">
        <i data-lucide="plus" class="stq-icon"></i> Novo Produto
      </a>
    </div>
  </header>

  <main class="stq-content">
    <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

    <form th:action="@{/web/produtos}" method="get" class="stq-filter-bar">
      <div class="stq-input-icon" style="flex:1; min-width:200px;">
        <i data-lucide="search" class="stq-icon"></i>
        <input type="text" name="nome" class="stq-input" placeholder="Buscar por nome..."
               th:value="${filtroNome}" />
      </div>
      <select name="categoriaId" class="stq-select" style="width:180px;">
        <option value="">Todas as categorias</option>
        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"
                th:selected="${cat.id == filtroCategoriaId}"></option>
      </select>
      <select name="ativo" class="stq-select" style="width:120px;">
        <option value="">Todos</option>
        <option value="true"  th:selected="${filtroAtivo == true}">Ativos</option>
        <option value="false" th:selected="${filtroAtivo == false}">Inativos</option>
      </select>
      <button type="submit" class="stq-btn stq-btn-outline">Filtrar</button>
      <a th:href="@{/web/produtos}" class="stq-btn stq-btn-ghost">Limpar</a>
    </form>

    <div class="stq-table-wrap">
      <table class="stq-table">
        <thead>
          <tr>
            <th>SKU</th><th>Nome</th><th>Categoria</th><th>Unidade</th><th>Est. Mín.</th><th>Status</th>
            <th sec:authorize="hasAnyRole('ADMIN','OPERADOR')"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="p : ${produtos.content}">
            <td><span class="stq-code" th:text="${p.sku}"></span></td>
            <td><a th:href="@{/web/produtos/{id}(id=${p.id})}" th:text="${p.nome}" class="stq-link"></a></td>
            <td th:text="${p.categoriaNome}"></td>
            <td th:text="${p.unidadeMedida}"></td>
            <td th:text="${p.estoqueMinimo}"></td>
            <td>
              <span class="stq-badge"
                    th:classappend="${p.ativo} ? 'stq-badge-success' : 'stq-badge-default'">
                <span class="stq-badge-dot"></span>
                <span th:text="${p.ativo} ? 'Ativo' : 'Inativo'"></span>
              </span>
            </td>
            <td sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
              <div class="stq-row-actions">
                <a th:href="@{/web/produtos/{id}/editar(id=${p.id})}" class="stq-btn stq-btn-ghost stq-btn-sm">
                  <i data-lucide="edit-2" class="stq-icon"></i>
                </a>
                <form th:action="@{/web/produtos/{id}/desativar(id=${p.id})}" method="post"
                      th:if="${p.ativo}" onsubmit="return confirm('Desativar este produto?')" class="d-inline">
                  <button type="submit" class="stq-btn stq-btn-ghost stq-btn-sm">
                    <i data-lucide="ban" class="stq-icon"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${produtos.content.empty}">
            <td colspan="7">
              <div class="stq-empty">
                <i data-lucide="package" class="stq-icon"></i>
                <p class="stq-empty-title">Nenhum produto encontrado</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="stq-pagination" th:if="${produtos.totalPages > 1}">
        <a class="stq-page-btn" th:classappend="${produtos.first} ? 'disabled'"
           th:href="@{/web/produtos(page=${produtos.number - 1},size=${produtos.size},nome=${filtroNome},categoriaId=${filtroCategoriaId},ativo=${filtroAtivo})}">
          <i data-lucide="chevron-left" class="stq-icon"></i> Anterior
        </a>
        <span class="stq-page-info"
              th:text="${'Pág. ' + (produtos.number + 1) + ' de ' + produtos.totalPages}"></span>
        <a class="stq-page-btn" th:classappend="${produtos.last} ? 'disabled'"
           th:href="@{/web/produtos(page=${produtos.number + 1},size=${produtos.size},nome=${filtroNome},categoriaId=${filtroCategoriaId},ativo=${filtroAtivo})}">
          Próxima <i data-lucide="chevron-right" class="stq-icon"></i>
        </a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
