<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estoque-ai — Produtos</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
</head>
<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Produtos</h2>
    <div class="d-flex gap-2">
      <a th:href="@{/web/produtos/categorias}" class="btn btn-outline-secondary btn-sm"
         sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Categorias</a>
      <a th:href="@{/web/produtos/novo}" class="btn btn-primary btn-sm"
         sec:authorize="hasAnyRole('ADMIN','OPERADOR')">+ Novo Produto</a>
    </div>
  </div>

  <div th:replace="~{layout/fragments/alertas :: alertas}"></div>

  <!-- Filtros -->
  <form th:action="@{/web/produtos}" method="get" class="row g-2 mb-4">
    <div class="col-md-4">
      <input type="text" name="nome" class="form-control" placeholder="Nome do produto"
             th:value="${filtroNome}" />
    </div>
    <div class="col-md-3">
      <select name="categoriaId" class="form-select">
        <option value="">Todas as categorias</option>
        <option th:each="cat : ${categorias}"
                th:value="${cat.id}"
                th:text="${cat.nome}"
                th:selected="${cat.id == filtroCategoriaId}">
        </option>
      </select>
    </div>
    <div class="col-md-2">
      <select name="ativo" class="form-select">
        <option value="">Todos</option>
        <option value="true" th:selected="${filtroAtivo == true}">Ativos</option>
        <option value="false" th:selected="${filtroAtivo == false}">Inativos</option>
      </select>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-outline-primary w-100">Filtrar</button>
    </div>
    <div class="col-md-1">
      <a th:href="@{/web/produtos}" class="btn btn-outline-secondary w-100">Limpar</a>
    </div>
  </form>

  <!-- Tabela -->
  <div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>SKU</th>
          <th>Nome</th>
          <th>Categoria</th>
          <th>Unidade</th>
          <th>Est. Mínimo</th>
          <th>Ativo</th>
          <th sec:authorize="hasAnyRole('ADMIN','OPERADOR')">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${produtos.content}">
          <td><code th:text="${p.sku}"></code></td>
          <td>
            <a th:href="@{/web/produtos/{id}(id=${p.id})}" th:text="${p.nome}"></a>
          </td>
          <td th:text="${p.categoriaNome}"></td>
          <td th:text="${p.unidadeMedida}"></td>
          <td th:text="${p.estoqueMinimo}"></td>
          <td>
            <span class="badge"
                  th:classappend="${p.ativo} ? 'bg-success' : 'bg-secondary'"
                  th:text="${p.ativo} ? 'Ativo' : 'Inativo'"></span>
          </td>
          <td sec:authorize="hasAnyRole('ADMIN','OPERADOR')">
            <div class="d-flex gap-1">
              <a th:href="@{/web/produtos/{id}/editar(id=${p.id})}"
                 class="btn btn-outline-secondary btn-sm">Editar</a>
              <form th:action="@{/web/produtos/{id}/desativar(id=${p.id})}"
                    method="post"
                    th:if="${p.ativo}"
                    onsubmit="return confirm('Desativar este produto?')">
                <button type="submit" class="btn btn-outline-danger btn-sm">Desativar</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${produtos.content.empty}">
          <td colspan="7" class="text-center text-muted">Nenhum produto encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginação -->
  <nav th:if="${produtos.totalPages > 1}">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${produtos.first} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/produtos(page=${produtos.number - 1}, size=${produtos.size}, nome=${filtroNome}, categoriaId=${filtroCategoriaId}, ativo=${filtroAtivo})}">
          Anterior
        </a>
      </li>
      <li class="page-item disabled">
        <span class="page-link"
              th:text="${'Página ' + (produtos.number + 1) + ' de ' + produtos.totalPages}"></span>
      </li>
      <li class="page-item" th:classappend="${produtos.last} ? 'disabled'">
        <a class="page-link"
           th:href="@{/web/produtos(page=${produtos.number + 1}, size=${produtos.size}, nome=${filtroNome}, categoriaId=${filtroCategoriaId}, ativo=${filtroAtivo})}">
          Próxima
        </a>
      </li>
    </ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmqXDsK8VZMu6Z+9ZWAgFRjh1Ah2"
        crossorigin="anonymous"></script>
</body>
</html>
